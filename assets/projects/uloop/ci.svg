<rect x="140" y="244" width="158" height="34" rx="6" class="row"/><text x="150" y="266" class="rt">implementer</text><rect x="240" y="251" width="50" height="20" rx="10" class="p-sonnet"/><text x="265" y="265" text-anchor="middle" class="pt">Sonnet</text>
<rect x="323" y="200" width="178" height="202" rx="10" class="card"/>
<text x="412" y="228" text-anchor="middle" class="ct">verify.py · 로컬</text>
<rect x="333" y="244" width="158" height="34" rx="6" class="row"/><text x="343" y="266" class="rt">범위 밖 변경</text>
