<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Pretendard, 'Malgun Gothic', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6070"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f6f5f1"/>
  <text x="40" y="72" font-size="34" font-weight="800" fill="#1d1f24">AI의 모든 도구 호출은 훅을 거친다</text>

  <!-- agent -->
  <rect x="150" y="380" width="260" height="140" rx="22" fill="#eee8fb" stroke="#7b4ce0" stroke-width="3"/>
  <text x="280" y="462" text-anchor="middle" font-size="30" font-weight="800" fill="#46209a">AI 에이전트</text>

  <!-- hook wall -->
  <rect x="640" y="150" width="70" height="620" rx="14" fill="#2f3542"/>
  <text x="675" y="128" text-anchor="middle" font-size="26" font-weight="800" fill="#2f3542">훅</text>

  <!-- arrows -->
  <g stroke="#5b6070" stroke-width="3" fill="none" stroke-linejoin="round">
    <path d="M410,450 H520 V250 H640"/>
    <path d="M410,450 H640"/>
    <path d="M410,450 H520 V650 H640"/>
  </g>
  <g stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M710,250 H1018" stroke="#139485"/>
    <path d="M710,650 H1018" stroke="#e08a1e"/>
  </g>
  <path d="M710,450 H860" stroke="#d1495b" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- verdict badges -->
  <circle cx="790" cy="250" r="26" fill="#139485"/>
  <path d="M777,251 l9,9 l17,-19" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="890" cy="450" r="26" fill="#d1495b"/>
  <path d="M879,439 l22,22 M901,439 l-22,22" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="790" cy="650" r="26" fill="#e08a1e"/>
  <circle cx="790" cy="642" r="7" fill="#fff"/>
  <path d="M777,664 a13,11 0 0 1 26,0 z" fill="#fff"/>

  <!-- targets -->
  <g font-size="27" font-weight="800">
    <rect x="1020" y="195" width="430" height="110" rx="18" fill="#fff" stroke="#139485" stroke-width="3"/>
    <text x="1060" y="261" fill="#0a524a">이슈 범위 안의 파일</text>

    <rect x="960" y="395" width="490" height="110" rx="18" fill="#fff" stroke="#d1495b" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="1000" y="461" fill="#9c2233">설정 · 비밀값 · .git</text>

    <rect x="1020" y="595" width="430" height="110" rx="18" fill="#fff" stroke="#e08a1e" stroke-width="3"/>
    <text x="1060" y="661" fill="#7a3e00">GitHub · Jira 쓰기</text>
  </g>

  <!-- legend -->
  <g font-size="21" font-weight="600" fill="#4a4d55">
    <circle cx="160" cy="820" r="11" fill="#139485"/><text x="180" y="827">허용</text>
    <circle cx="280" cy="820" r="11" fill="#d1495b"/><text x="300" y="827">차단</text>
    <circle cx="400" cy="820" r="11" fill="#e08a1e"/><text x="420" y="827">사람 확인 후 실행</text>
  </g>
</svg>
