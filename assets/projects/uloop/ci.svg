<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 528" width="1100" height="528" role="img" aria-labelledby="t d">
<title id="t">UnityLoop CI 워크플로와 실패 원인 분류</title>
<desc id="d">프로젝트 프로필에서 ci.py가 GitHub Actions 워크플로를 만들어 대상 저장소에 설치하고, preflight가 PR 전에 프로필 일치와 시크릿 이름을 확인한다. PR마다 Changes 작업이 실행할 작업을 정하고 Unity 작업이 디스크 정리, 체크아웃, Library 캐시, GameCI EditMode 테스트, 결과 업로드를 한다. pr.py가 검사 등록을 기다린 뒤 실패한 작업 로그를 정규식으로 대조해 통과, 코드 실패, 인프라 실패로 나눈다.</desc>
<!-- 근거: 1Seong/UnityLoopInner scripts/ci.py, ci-templates/unity-editmode/job.yml, scripts/pr.py(INFRA_PATTERNS, REGISTER_WAIT 600, REGISTER_POLL 15), docs/DECISIONS.md I-D14·I-D15 -->
<style>
text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#0F172A}
.title{font-size:22px;font-weight:700}.sub{font-size:13.5px;fill:#475569}.lg{font-size:12.5px;fill:#475569}
.lane{fill:#F8FAFC;stroke:#E2E8F0}.lt{font-size:15px;font-weight:700}.ls{font-size:12px;fill:#64748B}
.card{fill:#fff;stroke:#94A3B8;stroke-width:1.5}.ct{font-size:15px;font-weight:700}.cs{font-size:12.5px;fill:#475569}
.job{fill:#fff;stroke:#2088FF;stroke-width:1.5}
.step{fill:#EFF6FF}.st{font-size:12.5px;fill:#1E293B}
.mono{font-family:'Cascadia Code',Consolas,monospace;font-size:12px;fill:#1E293B}
.ok{fill:#ECFDF5;stroke:#059669;stroke-width:1.5}.okt{font-size:15px;font-weight:700;fill:#065F46}
.ask{fill:#FEF3C7;stroke:#D97706;stroke-width:1.5}.askt{font-size:15px;font-weight:700;fill:#92400E}
.no{fill:#FEF2F2;stroke:#DC2626;stroke-width:1.5}.not{font-size:15px;font-weight:700;fill:#B91C1C}
.bt{font-size:12.5px;fill:#334155}
.tag{fill:#fff;stroke:#D97706}.tagt{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;fill:#92400E}
.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}
.bus{fill:none;stroke:#334155;stroke-width:2}
.dash{fill:none;stroke:#334155;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#a)}
</style>
