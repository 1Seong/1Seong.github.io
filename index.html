<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Seongwon Choi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- 아이콘: 사용 중인 Tabler 아이콘만 담은 로컬 서브셋 (재생성: bash .claude/scripts/build-icons.sh) -->
<link rel="stylesheet" href="assets/vendor/tabler-icons/tabler-icons-subset.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* 베이스: 라벤더 화이트 — Tunic/Monument Valley */
  --navy:       #f7f5ff;
  --navy-2:     #ede9fb;
  --navy-3:     #ddd8f5;
  --navy-4:     #c9c2ee;
  /* 텍스트 */
  --cream:      #1a1440;
  --cream-2:    #2e2660;
  --cream-3:    #6b619a;
  /* 포인트: 비비드 인디고 */
  --gold:       #5040c8;
  --gold-light: #7060e0;
  --white:      #0d0926;
  /* 네비·푸터: 딥 미드나잇 퍼플 */
  --nav-bg:     #1a1440;
  --nav-ink:    #e2dcff;
  --nav-ink-2:  #8878cc;
  --nav-accent: #a0f0d8;
  /* 파도 */
  --wave-1:     #6b58e0;
  --wave-2:     #4878d8;
  --wave-3:     #a0f0d8;
  /* 규칙선 */
  --rule:       rgba(26,20,64,0.08);
  --rule-mid:   rgba(26,20,64,0.15);
  --sans:       'Outfit', 'Noto Sans KR', sans-serif;
  --nav-h:      72px;
  --max-w:      1080px;
  --pad:        clamp(1rem, 3.5vw, 2rem);
  --radius:     4px;
}
html { scroll-behavior: smooth; }
body { word-break: keep-all; font-family: var(--sans); background: var(--navy); color: var(--cream); line-height: 1.7; -webkit-font-smoothing: antialiased; }

/* ── NAV ── */
#nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--nav-bg);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  transition: box-shadow .3s;
}
#nav.scrolled { box-shadow: 0 4px 20px rgba(26,20,64,.3); }
.nav-inner {
  height: 60px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--pad);
}

/* 푸터 파도 */
.footer-wave {
  width: 100%; height: 60px;
  position: relative; overflow: hidden;
  background: var(--navy);
  pointer-events: none;
  margin-top: 6rem;
}
.footer-wave svg {
  position: absolute; bottom: 0; left: 0;
  will-change: transform;
}
.fwsvg1 { width: 2880px; }
.fwsvg2 { width: 2880px; opacity: .75; }
.fwsvg3 { width: 2880px; opacity: .5; }

.nav-logo { font-size: 1rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--nav-ink); text-decoration: none; }
.nav-logo span { color: var(--nav-accent); }
.nav-links { display: flex; gap: 2rem; list-style: none; }
.nav-links a { font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--nav-ink-2); text-decoration: none; transition: color .2s; }
.nav-links a:hover { color: var(--nav-accent); }
@media(max-width:680px) {
  .nav-inner { height: auto; min-height: 72px; flex-direction: column; align-items: flex-start; justify-content: center; gap: .3rem; padding: .6rem var(--pad); }
  .nav-logo { font-size: .9rem; }
  .nav-links { width: 100%; justify-content: space-between; gap: .6rem; }
  .nav-links a { font-size: .7rem; letter-spacing: 0; }
}

main { max-width: var(--max-w); margin: 0 auto; padding: calc(var(--nav-h) + 2.5rem) var(--pad) 0; }

.eyebrow { display: inline-flex; align-items: center; gap: .6rem; font-size: .88rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: 2.5rem; }
.eyebrow-hint { font-size: .80rem; font-weight: 400; letter-spacing: .06em; text-transform: none; color: var(--cream-3); opacity: .7; }
.eyebrow::before { content: ''; display: block; width: 28px; height: 2px; background: var(--gold); }
.rule { border: none; border-top: 1px solid var(--rule); margin: 5rem 0; }
.hidden-section-rule { display: none; }
[hidden] { display: none !important; }

#about { width: 100%; }
#about-grid {
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr) minmax(300px, 380px);
  gap: 3rem;
  align-items: start;
}
#about-grid:not(:has(.about-glance:not([hidden]))) { grid-template-columns: 180px 1fr; max-width: 720px; gap: 4rem; }
@media(max-width:1000px){ #about-grid { grid-template-columns: 180px minmax(0, 1fr); } .about-glance { grid-column: 1 / -1; } }
@media(max-width:640px){
  /* 모바일: 사진을 줄여 이름 옆에 두고, 패널을 압축해 첫 화면 안에 한눈에 보기가 들어오게 한다 */
  #about-grid { grid-template-columns: 84px minmax(0, 1fr); gap: 1.5rem 1.1rem; }
  #about-grid .about-photo { width: 84px; height: 84px; border-width: 2px; box-shadow: 0 0 0 4px var(--navy-2), 0 0 0 5px rgba(80,64,200,0.2); }
  #about-grid .about-tag { margin-bottom: .7rem; }
  #about-grid .about-name-en { margin-bottom: 1rem; }
  #about-grid .about-divider { margin-bottom: 1rem; }
  #about-grid .about-meta { line-height: 1.8; }
}

.about-photo { width: 180px; height: 180px; border-radius: 50%; background: var(--navy-3); border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; color: var(--cream-3); font-size: .72rem; letter-spacing: .08em; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 6px var(--navy-2), 0 0 0 7px rgba(80,64,200,0.2); }
.about-photo img { width: 100%; height: 100%; object-fit: cover; }
.about-tag { display: inline-block; font-size: .68rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold); padding: .25rem .75rem; margin-bottom: 1.25rem; }
.about-name { font-size: clamp(2.4rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05; letter-spacing: -.01em; color: var(--nav-bg); margin-bottom: .4rem; }
.about-name-en { font-size: .85rem; font-weight: 400; letter-spacing: .12em; color: var(--cream-3); margin-bottom: 2rem; }
.about-divider { width: 40px; height: 2px; background: var(--gold); margin-bottom: 1.5rem; }
.about-meta { font-size: .9rem; color: var(--cream-2); line-height: 2.2; }
.about-meta a { color: var(--cream-2); text-decoration: none; border-bottom: 1px solid var(--rule-mid); transition: color .2s; }
.about-meta a:hover { color: var(--gold-light); }

/* ── 히어로 한눈에 보기 패널: 성과 수치, 수상·자격증, 대표 프로젝트 (모두 기존 데이터에서 생성) ── */
.about-glance { border: 1px solid var(--rule-mid); background: var(--navy-2); border-radius: 8px; padding: 1.25rem 1.25rem 1rem; display: flex; flex-direction: column; gap: 1.1rem; box-shadow: 0 12px 32px rgba(20,16,55,.06); }
.glance-label { font-size: .64rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: .55rem; }
.glance-stats { display: flex; gap: .6rem; flex-wrap: wrap; }
.glance-stat { flex: 1 1 0; min-width: 120px; display: flex; align-items: baseline; gap: .5rem; flex-direction: row-reverse; justify-content: flex-end; background: var(--navy); border: 1px solid var(--rule); border-radius: 6px; padding: .5rem .8rem; }
.glance-stat-v { display: block; font-size: 1.35rem; font-weight: 700; line-height: 1.15; color: var(--gold); }
.glance-stat-k { display: block; font-size: .8rem; color: var(--cream-2); }
.glance-list { list-style: none; display: flex; flex-direction: column; gap: .45rem; }
.glance-honor { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: .65rem; align-items: center; }
.glance-honor-icon { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--navy); font-size: 15px; }
.glance-honor.cert .glance-honor-icon { background: var(--navy-3); color: var(--gold); }
.glance-honor-t { display: block; font-size: .9rem; font-weight: 600; color: var(--cream); line-height: 1.35; }
.glance-honor-s { display: block; font-size: .74rem; color: var(--cream-3); line-height: 1.35; }
.glance-proj { width: 100%; display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: .7rem; align-items: center; padding: .4rem; margin: 0 -.4rem; background: none; border: 1px solid transparent; border-radius: 6px; cursor: pointer; text-align: left; font-family: var(--sans); color: inherit; transition: background .2s, border-color .2s; width: calc(100% + .8rem); }
.glance-proj:hover, .glance-proj:focus-visible { background: var(--navy); border-color: var(--rule-mid); outline: none; }
.glance-proj-thumb { width: 64px; height: 40px; border-radius: 4px; object-fit: cover; background: var(--navy-3); display: block; }
.glance-proj-t { display: block; font-size: .9rem; font-weight: 600; color: var(--cream); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.glance-proj-s { display: block; font-size: .74rem; color: var(--cream-3); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.glance-proj-badge { font-size: .66rem; font-weight: 700; letter-spacing: .04em; color: var(--navy); background: var(--gold); border-radius: 999px; padding: .2rem .55rem; white-space: nowrap; }
.glance-proj-arrow { color: var(--cream-3); font-size: 15px; transition: transform .2s, color .2s; }
.glance-proj:hover .glance-proj-arrow { transform: translateX(2px); color: var(--gold); }
@media(max-width:640px){
  .about-glance { padding: 1rem .9rem .75rem; gap: .9rem; }
  .glance-stat { min-width: 0; padding: .45rem .7rem; }
  .glance-list { gap: .3rem; }
  .glance-proj { grid-template-columns: 48px minmax(0, 1fr) auto; gap: .6rem; padding: .3rem .4rem; }
  .glance-proj-thumb { width: 48px; height: 30px; }
  .glance-proj-s { display: none; }
}
.link-icons { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 2rem; }
.link-icon { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem 1.1rem; border: 1px solid var(--rule-mid); font-size: .73rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--cream-2); text-decoration: none; background: var(--navy-3); transition: background .2s, color .2s, border-color .2s; }
.link-icon:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.link-icon svg { width: 14px; height: 14px; fill: currentColor; }

.skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; align-items: end; }
.cup { position: relative; border-radius: 4px 4px 12px 12px; overflow: hidden; transition: transform .22s cubic-bezier(.34,1.56,.64,1); cursor: default; }
.cup:hover { transform: translateY(-6px); }
.other-works-grid { display: flex; flex-direction: column; gap: 1.25rem; }
.ow-row { display: flex; gap: 1.25rem; align-items: baseline; flex-wrap: wrap; }
.ow-cat { font-size: .68rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); flex-shrink: 0; width: 140px; padding-top: .15rem; }
.ow-tags { display: flex; gap: .5rem; flex-wrap: wrap; }
.ow-tag { font-size: .8rem; font-weight: 400; color: var(--cream-2); padding: .25rem .7rem; border: 1px solid var(--rule-mid); border-radius: 999px; background: var(--navy-2); transition: border-color .2s, color .2s; }
.ow-tag:hover { border-color: var(--gold); color: var(--gold-light); }
.cup-water { position: absolute; bottom: 0; left: 0; right: 0; z-index: 1; }
.wave-wrap { position: absolute; top: -20px; left: 0; width: 200%; height: 22px; pointer-events: none; }
.wave-svg { display: block; width: 100%; height: 22px; }
@keyframes cupWave { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
.cwl1 { animation: cupWave 5.5s linear infinite; }
.cwl2 { animation: cupWave 8s linear infinite reverse; }
.cup:hover .cwl1 { animation-duration: 3.5s; }
.cup:hover .cwl2 { animation-duration: 5s; }
.cup-items { position: absolute; bottom: 0; left: 0; right: 0; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 11px 10px; }
.cup-item { display: flex; align-items: center; gap: 7px; font-size: .82rem; font-weight: 500; padding: 6px 6px; border-radius: 4px; }
.cup-badge { width: 20px; height: 20px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 800; flex-shrink: 0; letter-spacing: -.02em; }
.cup-cat { position: absolute; top: 13px; left: 13px; right: 13px; font-size: .6rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; display: flex; align-items: center; gap: 5px; z-index: 3; }
.cup-cat-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }



.milestone-timeline {
  position: relative;
  max-width: 900px;
}

.milestone-map {
  position: relative;
  border: 1px solid var(--rule-mid);
  background: var(--navy-2);
  border-radius: var(--radius);
  padding: 1.15rem 1.2rem 1.2rem;
  overflow: hidden;
}

.milestone-map::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: linear-gradient(to bottom, var(--gold), rgba(160,240,216,.9));
  opacity: .75;
}

.milestone-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 1rem;
  margin-bottom: 1rem;
  padding-bottom: .85rem;
  border-bottom: 1px solid var(--rule);
}

.milestone-kicker {
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--nav-bg);
  margin-bottom: .25rem;
}

.milestone-title {
  font-size: clamp(1.05rem, 2vw, 1.45rem);
  line-height: 1.2;
  font-weight: 700;
  color: var(--white);
  letter-spacing: -.01em;
}

.milestone-sub {
  font-size: .78rem;
  color: var(--cream-3);
  line-height: 1.55;
  text-align: right;
}

.milestone-years {
  display: grid;
  gap: .9rem;
}

.milestone-category-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(280px, .75fr);
  grid-template-areas:
    "activities awards"
    "activities certificates";
  gap: 1rem;
  align-items: start;
}

.milestone-category {
  border: 1px solid var(--rule-mid);
  background: var(--navy-2);
  border-radius: var(--radius);
  overflow: hidden;
}
.milestone-category.activities { grid-area: activities; }
.milestone-category.awards { grid-area: awards; }
.milestone-category.certificates { grid-area: certificates; }
.milestone-category.awards .milestone-badge,
.milestone-category.certificates .milestone-badge { display: none; }
.milestone-category.awards .milestone-node,
.milestone-category.certificates .milestone-node { grid-template-columns: 28px 1fr; }

.milestone-category-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  padding: .9rem 1rem;
  border-bottom: 1px solid var(--rule);
  background: var(--navy-3);
}

.milestone-category-title {
  display: flex;
  align-items: center;
  gap: .55rem;
  color: var(--white);
  font-size: .95rem;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.milestone-category-title i {
  color: var(--nav-bg);
  font-size: 1.05rem;
}

.milestone-category-count {
  color: var(--cream-3);
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .08em;
}

.milestone-category-list {
  display: grid;
  gap: .55rem;
  padding: .75rem;
}

.milestone-year-row {
  display: grid;
  grid-template-columns: 70px 1fr;
  gap: .85rem;
  align-items: start;
}

.milestone-year {
  position: sticky;
  top: calc(var(--nav-h) + 1rem);
  align-self: start;
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .14em;
  color: var(--gold);
  padding-top: .55rem;
}

.milestone-path {
  position: relative;
  display: grid;
  gap: .5rem;
  padding-left: 1rem;
}

.milestone-path::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 12px;
  bottom: 12px;
  width: 1.5px;
  background: var(--rule-mid);
}

.milestone-node {
  position: relative;
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: .68rem;
  align-items: center;
  padding: .62rem .72rem .62rem .5rem;
  border: 1px solid var(--rule);
  background: rgba(221,216,245,.42);
  border-radius: var(--radius);
  transition: border-color .2s, transform .2s, background .2s;
}

.milestone-node:hover {
  transform: translateX(3px);
  border-color: var(--rule-mid);
  background: var(--navy-3);
}

.milestone-dot {
  position: relative;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--navy-3);
  color: var(--gold);
  font-size: 14px;
  box-shadow: 0 0 0 4px var(--navy);
}

.milestone-node.award {
  border-color: rgba(80,64,200,.35);
  background: rgba(80,64,200,.065);
}

.milestone-node.award .milestone-dot {
  background: var(--gold);
  color: var(--navy);
}

.milestone-node.exhibition .milestone-dot { color: #2b7f73; }
.milestone-node.jam .milestone-dot { color: #8a6420; }
.milestone-node.program .milestone-dot { color: var(--gold); }
.milestone-node.cert .milestone-dot { color: #6d5de0; }

.milestone-body { min-width: 0; }

.milestone-node-title {
  font-size: .88rem;
  font-weight: 600;
  color: var(--cream);
  line-height: 1.38;
}

.milestone-node-org {
  font-size: .72rem;
  color: var(--cream-3);
  margin-top: .08rem;
}

.milestone-badge {
  justify-self: end;
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  font-size: .58rem;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--cream-3);
  border: 1px solid var(--rule-mid);
  background: var(--navy-2);
  border-radius: 999px;
  padding: .2rem .5rem;
}

.milestone-node.award .milestone-badge {
  color: var(--gold);
  border-color: rgba(80,64,200,.35);
  background: rgba(80,64,200,.08);
}

@media(max-width:560px){
  .milestone-map { padding: 1rem; }
  .milestone-category-grid {
    grid-template-columns: 1fr;
    grid-template-areas:
      "activities"
      "awards"
      "certificates";
  }
  .milestone-head {
    align-items: start;
    flex-direction: column;
  }
  .milestone-sub { text-align: left; }
  .milestone-year-row {
    grid-template-columns: 1fr;
    gap: .35rem;
  }
  .milestone-year {
    position: static;
    padding-top: 0;
  }
  .milestone-node {
    grid-template-columns: 28px 1fr;
  }
  .milestone-badge {
    grid-column: 2;
    justify-self: start;
  }
}

.projects-list { display: flex; flex-direction: column; }
.projects-group-label { font-size: .68rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin: 0 0 .8rem; }
.projects-main { display: flex; flex-direction: column; }
.projects-sub { position: relative; margin-top: 3rem; padding: 2.6rem 0 .4rem; overflow: hidden; border-top: 1px solid var(--rule); }
.projects-sub-head { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: .7rem; }
.projects-sub .projects-group-label { display: inline-flex; align-items: center; gap: .6rem; font-size: .88rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: .2rem; }
.projects-sub .projects-group-label::before { content: ''; display: block; width: 28px; height: 2px; background: var(--gold); }
.sub-project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; }
.sub-project-card { position: relative; min-width: 0; display: flex; flex-direction: column; gap: .9rem; padding: 1rem; border: 1px solid var(--rule); background: var(--navy-2); border-radius: var(--radius); transition: border-color .2s, box-shadow .2s; }
.sub-project-card:hover, .sub-project-card:focus-within { border-color: var(--rule-mid); box-shadow: 0 10px 30px rgba(20,16,55,.06); }
.sub-project-card .proj-media { width: 100%; min-width: 0; }
.sub-project-card .proj-slider { aspect-ratio: 2/1; }
.sub-project-card .slide-type-badge { display: none; }
.sub-project-card .proj-info { flex: 1; gap: .55rem; min-width: 0; }

.code-link:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media(max-width:760px){ .contributions { grid-template-columns: 1fr; } }
.contribution {
  background: var(--navy-2); border: 1px solid var(--rule); border-radius: var(--radius);
  overflow: hidden; transition: border-color .2s;
}
.contribution:hover { border-color: var(--gold); }
.contribution-header {
  display: flex; align-items: center; gap: .85rem;
  padding: .85rem 1rem; cursor: pointer; user-select: none;
  transition: background .15s;
}
.contribution-header:hover { background: rgba(80,64,200,.04); }
.contribution-icon {
  width: 30px; height: 30px; border-radius: 6px; flex-shrink: 0;
  background: var(--navy-3); display: flex; align-items: center; justify-content: center;
  font-size: .95rem; color: var(--cream-3); transition: background .2s, color .2s;
}
.contribution.open .contribution-icon { background: rgba(80,64,200,.18); color: var(--gold); }
.contribution-title {
  flex: 1; font-size: 1rem; font-weight: 600; color: var(--white); line-height: 1.3;
}
.contribution-badge {
  font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px; flex-shrink: 0; border: 1px solid transparent;
  transition: opacity .2s;
}
.contribution.open .contribution-badge { opacity: .8; }
/* chevron — 오른쪽 끝에 명확하게 */
.contribution-chevron {
  font-size: 1.1rem; color: var(--cream-3); flex-shrink: 0; margin-left: .25rem;
  transition: transform .25s ease, color .2s;
  background: var(--navy-3); border-radius: 50%;
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
}
.contribution.open .contribution-chevron { transform: rotate(180deg); color: var(--gold); background: rgba(80,64,200,.18); }
.contribution-body {
  max-height: 0; overflow: hidden;
  transition: max-height .35s ease, padding .3s ease;
  padding: 0 1rem;
}
.contribution.open .contribution-body { max-height: 1200px; padding: 0 1rem 1rem; }
/* 이미지 — desc 위에 */
.contribution-img-wrap { margin-bottom: .85rem; border-radius: var(--radius); overflow: hidden; }
.contribution-img-wrap img { width: 100%; display: block; object-fit: cover; max-height: 240px; }
.contribution-desc { font-size: .92rem; color: var(--cream-2); line-height: 1.85; border-top: 1px solid var(--rule); padding-top: .75rem; }
.contribution-desc strong { display: block; color: var(--white); font-weight: 600; margin-bottom: .4rem; }
.contribution-desc ul { margin: .3rem 0 0; padding-left: 1.1rem; }
.contribution-desc li { margin-bottom: .2rem; }

/* 회고 이미지 */
.retro-images { display: flex; gap: .75rem; margin-top: 1rem; flex-wrap: wrap; }
.retro-images img { height: 290px; border-radius: var(--radius); object-fit: cover; flex: 1; min-width: 120px; max-width: 100%; }

/* 피드백 인용 */
.feedback-quotes { display: flex; flex-direction: column; gap: .75rem; margin-top: 1rem; }
.feedback-quote { padding: .85rem 1rem .85rem 1.25rem; border-left: 2px solid var(--gold); background: var(--navy-2); border-radius: 0 var(--radius) var(--radius) 0; box-shadow: none; }
.feedback-quote-text { font-size: .88rem; color: var(--cream-2); line-height: 1.75; font-style: italic; }
.feedback-quote-author { font-size: .72rem; color: var(--cream-3); margin-top: .4rem; }
/* 회고 */
.retro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media(max-width:500px){ .retro-grid { grid-template-columns: 1fr; } }
.retro-card { padding: 1.15rem 1.25rem; border-radius: var(--radius); border: 1px solid var(--rule); box-shadow: 0 12px 32px rgba(26,20,64,.035); }
.retro-card.good { border-color: rgba(64,160,100,.25); background: rgba(64,160,100,.06); }
.retro-card.bad  { border-color: rgba(200,151,58,.25);  background: rgba(200,151,58,.06); }
.retro-card-label { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .65rem; }
.retro-card.good .retro-card-label { color: #4a9e6a; }
.retro-card.bad  .retro-card-label { color: var(--gold); }
.retro-card-text { font-size: .855rem; color: var(--cream-2); line-height: 1.8; }
.feedback-chart { display: flex; flex-direction: column; gap: .8rem; padding: 1rem; border: 1px solid var(--rule-mid); background: var(--navy-2); border-radius: var(--radius); box-shadow: none; }
.feedback-row { display: flex; align-items: center; gap: 1rem; }
.feedback-label-wrap { display: flex; flex-direction: column; gap: .1rem; width: 68px; flex-shrink: 0; }
.feedback-label { font-size: .8rem; color: var(--cream-2); }
.feedback-bar-wrap { flex: 1; max-width: 480px; height: 8px; background: var(--navy-3); border-radius: 4px; overflow: hidden; }
.feedback-bar { height: 100%; border-radius: 4px; background: linear-gradient(to right, #5040c8, #a0f0d8); transition: width .8s cubic-bezier(.22,1,.36,1); }
.feedback-val { font-size: .78rem; color: var(--cream-3); width: 44px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.feedback-source { font-size: .68rem; color: var(--cream-3); }
.troubleshooting-list, .optimization-list, .feedback-iteration-list { display: grid; gap: .7rem; }
.feedback-iteration-list { margin-top: .9rem; }
.flow-card { border: 1px solid var(--rule-mid); background: var(--navy-2); border-radius: var(--radius); overflow: hidden; box-shadow: none; }
.flow-card-title { display: flex; align-items: center; justify-content: space-between; gap: .65rem; padding: .65rem 1rem; border-bottom: 1px solid rgba(26,20,64,.09); color: var(--white); font-size: .95rem; font-weight: 700; background: var(--navy-3); }
.flow-card-title span { min-width: 0; }
.flow-row { display: grid; grid-template-columns: repeat(var(--flow-count, 4), 1fr); }
.flow-cell { position: relative; padding: 1rem 1rem .95rem; border-right: 1px solid rgba(26,20,64,.085); min-width: 0; background: var(--flow-bg, transparent); }
.flow-cell:last-child { border-right: none; }
.flow-cell:not(:last-child)::after {
  content: '→';
  position: absolute;
  top: 50%;
  right: -13px;
  z-index: 2;
  width: 26px;
  height: 26px;
  border: 1px solid var(--rule-mid);
  border-radius: 50%;
  background: inherit;
  color: var(--gold);
  display: grid;
  place-items: center;
  font-size: .8rem;
  font-weight: 700;
  transform: translateY(-50%);
}
.flow-step-0 { --flow-bg: rgba(80,64,200,.055); }
.flow-step-1 { --flow-bg: rgba(30,95,168,.055); }
.flow-step-2 { --flow-bg: rgba(14,112,112,.055); }
.flow-step-3 { --flow-bg: rgba(146,96,10,.055); }
.flow-step-0 .flow-label { color: #5040c8; }
.flow-step-1 .flow-label { color: #1e5fa8; }
.flow-step-2 .flow-label { color: #0e7070; }
.flow-step-3 .flow-label { color: #92600a; }
.flow-label { display: inline-flex; align-items: center; gap: .4rem; font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .45rem; }
.flow-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.flow-text { font-size: .82rem; color: var(--cream-2); line-height: 1.65; }
.feedback-flow-card { border: none; background: transparent; overflow: visible; }
.feedback-flow-card .flow-row { display: grid; grid-template-columns: minmax(0, 1fr) 42px minmax(0, 1fr); gap: .7rem; align-items: stretch; }
.feedback-flow-card .flow-cell { border: 1px solid var(--rule-mid); border-radius: var(--radius); background: var(--navy-2); }
.feedback-flow-card .flow-cell:first-child { grid-column: 1; }
.feedback-flow-card .flow-cell:first-child { display: flex; flex-direction: column; }
.feedback-quote-mark { position: absolute; top: .45rem; right: .65rem; font-size: 3rem; color: var(--gold); opacity: .08; pointer-events: none; }
.feedback-flow-card .flow-label, .feedback-flow-card .flow-text { position: relative; }
.feedback-citation { display: block; align-self: flex-end; margin-top: auto; padding-top: .55rem; font-size: .72rem; line-height: 1.5; color: var(--cream-3); text-align: right; text-decoration: none; }
a.feedback-citation:hover { color: var(--gold); }
.feedback-quote { position: relative; }
.feedback-quote-text { position: relative; }
.feedback-flow-card .flow-cell:last-child { grid-column: 3; }
.feedback-flow-card .flow-cell:first-child::after {
  content: '→';
  position: absolute;
  top: 50%;
  right: -49px;
  z-index: 2;
  width: 34px;
  height: 34px;
  border: 1px solid var(--rule-mid);
  border-radius: 50%;
  background: var(--navy-2);
  color: var(--gold);
  display: grid;
  place-items: center;
  font-size: 1rem;
  font-weight: 800;
  transform: translateY(-50%);
}
.feedback-flow-card .flow-cell:last-child::after { display: none; }
.iteration-card { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--rule); background: var(--navy-2); border-radius: var(--radius); overflow: hidden; }
.iteration-half { padding: .9rem 1rem; }
.iteration-half:first-child { border-right: 1px solid var(--rule); }
@media(max-width:760px){
  .flow-row, .iteration-card { grid-template-columns: 1fr; }
  .flow-cell, .iteration-half:first-child { border-right: none; border-bottom: 1px solid var(--rule); }
  .flow-cell:not(:last-child)::after { display: none; }
  .feedback-flow-card .flow-row { grid-template-columns: 1fr; gap: .55rem; }
  .feedback-flow-card .flow-cell:first-child,
  .feedback-flow-card .flow-cell:last-child { grid-column: auto; }
  .feedback-flow-card .flow-cell:first-child::after { display: none; }
}

/* 사이드바 */
.detail-sidebar { position: fixed; top: calc(var(--nav-h) + 2rem); right: -1.45rem; width: 238px; z-index: 20; pointer-events: none; }
.sidebar-block { margin-bottom: 0; padding: 1.05rem 3.2rem 1.15rem 1.05rem; border: 1px solid var(--rule-mid); background: rgba(237,233,251,.92); border-radius: var(--radius); box-shadow: 0 18px 60px rgba(20,16,55,.12); backdrop-filter: blur(12px); pointer-events: auto; }
.sidebar-block:last-child { border-bottom: 1px solid var(--rule-mid); }
.sidebar-label { font-size: 1.08rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--nav-bg); margin-bottom: .8rem; }
.sidebar-value { font-size: .82rem; color: var(--cream-2); line-height: 2; }
.sidebar-link { display: flex; align-items: center; gap: .5rem; font-size: .78rem; font-weight: 500; color: var(--cream-2); text-decoration: none; padding: .5rem .75rem; border: 1px solid var(--rule-mid); background: var(--navy-3); margin-bottom: .4rem; border-radius: var(--radius); transition: background .2s, color .2s, border-color .2s; }
.sidebar-link:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.sidebar-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; }
.detail-toc { display: grid; gap: .1rem; }
.detail-toc a { display: block; color: var(--cream-3); text-decoration: none; font-size: .94rem; font-weight: 500; letter-spacing: 0; text-transform: none; line-height: 1.42; padding: .5rem 0; border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
.detail-toc a:hover { color: var(--gold); border-color: var(--rule-mid); }
@media(max-width:1180px){
  .detail-sidebar { position: static; width: auto; margin-bottom: 1.5rem; }
  .sidebar-block { padding: 1rem 1rem 1.1rem; }
  .detail-body { display: flex; flex-direction: column; }
  .detail-body #d-main { width: 100%; max-width: none; }
  .detail-sidebar { order: -1; }
}

footer { background: var(--nav-bg); padding: 0; }
.footer-wave {
  width: 100%; height: 40px;
  position: relative; overflow: hidden; line-height: 0;
  background: var(--bg);
}
.footer-wave svg {
  position: absolute; bottom: 0; left: 0;
  height: 40px; will-change: transform;
}
.fwsvg1 { width: 2880px; }
.fwsvg2 { width: 2880px; opacity: .65; }
.fwsvg3 { width: 2880px; opacity: .38; }
.footer-inner { max-width: var(--max-w); margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem; padding: 2.5rem var(--pad); }
.footer-brand { font-size: 1rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--nav-ink); }
.footer-brand span { color: var(--nav-accent); }
.footer-links { display: flex; gap: 1.5rem; }
.footer-links a { font-size: .72rem; font-weight: 500; letter-spacing: .08em; color: var(--nav-ink-2); text-decoration: none; transition: color .2s; }
.footer-links a:hover { color: var(--nav-accent); }
.footer-copy { font-size: .72rem; color: var(--nav-ink-2); width: 100%; }

@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
.fade-up { animation: fadeUp .55s ease both; }
.fu1{animation-delay:.06s} .fu2{animation-delay:.13s} .fu3{animation-delay:.20s} .fu4{animation-delay:.27s} .fu5{animation-delay:.34s}

.detail-nav-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 5rem; padding-top: 2rem; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.detail-nav-btn { display: inline-flex; align-items: center; gap: .5rem; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: .65rem 1.25rem; border: 1px solid var(--rule-mid); background: transparent; color: var(--cream-2); cursor: pointer; font-family: var(--sans); border-radius: var(--radius); transition: background .2s, color .2s, border-color .2s; }
.detail-nav-btn:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.detail-nav-btn:disabled { opacity: .3; cursor: default; pointer-events: none; }
.detail-nav-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.5; }
.detail-nav-center { display: flex; gap: .75rem; }
.shelf-row { display: flex; flex-direction: row; gap: 6px; align-items: flex-end; padding: 0 8px; flex-wrap: wrap; }
.shelf-floor { height: 6px; background: var(--rule-mid); border-radius: 2px; margin: 0 0 1rem; }
.shelf-legend { display: flex; gap: 1.25rem; flex-wrap: wrap; padding: 0 8px; }
.shelf-legend-item { display: flex; align-items: center; gap: 6px; font-size: .72rem; color: var(--cream-3); }
.shelf-legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

.book-wrap { position: relative; flex-shrink: 0; width: 38px; cursor: default; z-index: 1; }
.book-wrap:hover { z-index: 500; }
.book-inner {
  position: relative; width: 38px;
  transition: transform .4s cubic-bezier(.34,1.2,.64,1), box-shadow .4s;
}
.book-wrap:hover .book-inner {
  transform: translateY(-60px);
  box-shadow: 0 20px 40px rgba(0,0,0,.5);
}
.book-spine-el {
  width: 38px; border-radius: 3px;
  border-left: 3px solid rgba(255,255,255,.2);
  display: flex; flex-direction: column; padding: 10px 5px;
  position: relative; z-index: 1;
}
.book-spine { writing-mode: vertical-lr; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; font-family: var(--sans); }
.book-cover-panel {
  position: absolute; bottom: 0; left: 0;
  width: 0; height: 100%; border-radius: 3px;
  overflow: hidden; z-index: 3;
  transition: width .4s cubic-bezier(.34,1.1,.64,1);
}
.book-wrap:hover .book-cover-panel { width: calc(var(--book-h) * 3 / 4); }
.book-cover-img { height: 100%; width: auto; object-fit: cover; display: block; }
.book-cover-bg { height: 100%; width: 100%; }
.book-popup {
  position: absolute; top: 0; width: 180px;
  background: var(--navy-2); border: 1px solid var(--rule-mid);
  border-radius: var(--radius); padding: 12px;
  opacity: 0; pointer-events: none;
  transform: translateX(-4px);
  transition: opacity .2s ease, transform .2s ease;
  z-index: 400;
}
.book-wrap:hover .book-popup { opacity: 1; pointer-events: auto; transform: translateX(0); transition-delay: .28s; }
.book-popup-genre { font-size: .6rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 5px; }
.book-popup-title { font-size: .82rem; font-weight: 500; color: var(--cream); line-height: 1.35; margin-bottom: 2px; }
.book-popup-author { font-size: .75rem; color: var(--cream-3); margin-bottom: 6px; }
.book-popup-memo { font-size: .75rem; color: var(--cream-3); line-height: 1.5; border-top: 1px solid var(--rule); padding-top: 6px; }

/* ── 섹션 좌측 그라디언트 라이트 ── */
.section-highlight { position: relative; overflow: visible; }
.section-highlight::before { display: none; }

/* 라이트 오버레이 — fixed, JS로 위치 제어 */
#section-light {
  position: fixed;
  left: 0; top: 0;
  width: 40vw;
  pointer-events: none;
  z-index: 1;
  background: linear-gradient(to right, rgba(80,64,200,.055) 0%, rgba(80,64,200,.02) 50%, transparent 100%);
  opacity: 0;
  transition: opacity .5s ease;
}
#section-light.visible { opacity: 1; }

/* ── 프로젝트 카드 light ──
   포커스 카드만 은은한 배경 빛으로 표시한다. 나머지 카드를 흐리게(opacity)·작게(scale) 하지 않는다:
   화면에 걸린 카드를 모두 읽을 수 있어야 훑어보기 쉽다. */
.project-card {
  position: relative; overflow: visible;
}
.project-card::after {
  content: '';
  position: absolute;
  left: calc(-1 * var(--pad)); right: 0; top: 0; bottom: 0;
  background: linear-gradient(to right, rgba(80,64,200,.09) 0%, rgba(80,64,200,.03) 45%, transparent 80%);
  opacity: 0;
  transition: opacity .5s ease;
  pointer-events: none;
}
.project-card.in-view::after { opacity: 1; }

@media print {
  :root { --navy:#fff; --navy-2:#fff; --navy-3:#f4f4f4; --cream:#111; --cream-2:#333; --cream-3:#666; --white:#000; --gold:#8a6420; }
  #nav { position: static; }
  #detail-view { display: none !important; }
  .proj-show-more { display: none; }
  .project-card { page-break-inside: avoid; }
}
</style>
</head>

<div id="section-light"></div>

<nav id="nav">
  <div class="nav-inner">
    <a href="#" class="nav-logo" onclick="showList();return false;">SW<span>.</span>CHOI</a>

      <li><a href="#awards"      onclick="showList('awards');return false;">Milestones</a></li>

      <li hidden><a href="#other-works" onclick="showList('other-works');return false;">Etc</a></li>

<main>
  <div id="list-view">

    <section id="about">
      <div class="eyebrow">About</div>
      <div id="about-grid">
        <div class="about-photo" id="about-photo-wrap"><img src="assets/profile1.jpg" alt="프로필 사진"></div>
        <div class="fade-up fu1">
          <div class="about-tag" id="about-role-tag"></div>
          <h1 class="about-name" id="about-name-ko"></h1>
          <div class="about-name-en" id="about-name-en"></div>
          <div class="about-divider"></div>
          <div class="about-meta" id="about-meta"></div>
          <div class="link-icons" id="link-icons"></div>
        </div>
        <aside class="about-glance fade-up fu1" id="about-glance" aria-label="한눈에 보기" hidden></aside>
      </div>
    </section>

    <hr class="rule">

    <section id="skills">
      <div class="eyebrow">Skills &amp; Tools</div>
      <div class="skills-grid" id="skills-grid"></div>
    </section>

    <hr class="rule">
    <section id="awards">
      <div class="eyebrow">Milestones</div>
      <div class="awards-col-grid" id="awards-col-grid"></div>

    <hr class="rule hidden-section-rule">

    <section id="books" hidden>
      <div class="eyebrow">Reading List <span class="eyebrow-hint">hover to preview</span></div>
      <div class="shelf-row" id="shelf"></div>
      <div class="shelf-floor"></div>
      <div class="shelf-legend" id="shelf-legend"></div>
    </section>

  </div>

  <div id="detail-view">
    <button class="detail-back" onclick="showList()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Projects
    </button>
    <div class="detail-eyebrow" id="d-eyebrow"></div>
    <h2 class="detail-title" id="d-title"></h2>
    <div class="detail-subtitle" id="d-subtitle"></div>
    <div class="detail-media" id="d-media"></div>
    <div class="detail-media-nav">
      <button class="slider-btn" id="d-prev"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="detail-media-dots" id="d-dots"></div>
      <button class="slider-btn" id="d-next"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <div class="detail-body">

// 히어로 오른쪽 '한눈에 보기' — 새 데이터 필드 없이 MILESTONE_SUMMARY, AWARDS, MAIN_PROJECT_IDS에서 만든다.
// 항목이 하나도 없으면 블록째 숨긴다.
function buildAboutGlance(){
  const el=document.getElementById('about-glance');
  if(!el) return;
  const parts=[];

  const stats=(typeof MILESTONE_SUMMARY!=='undefined' ? MILESTONE_SUMMARY : []).filter(s=>s && s.value);
  if(stats.length){
    parts.push(`<div class="glance-stats">${stats.map(s=>`
      <div class="glance-stat"><span class="glance-stat-v">${escapeHTML(s.value)}</span><span class="glance-stat-k">${escapeHTML(s.label)}</span></div>`).join('')}
    </div>`);
  }

  const A=(typeof AWARDS!=='undefined' && AWARDS) || {};
  const honors=[
    ...(A['수상']||[]).map(x=>({...x, kind:'award', icon:'ti-trophy'})),
    ...(A['시험및자격증']||[]).map(x=>({...x, kind:'cert', icon:'ti-certificate'})),
  ];
  if(honors.length){
    parts.push(`<div><div class="glance-label">Awards &amp; Certificates</div><ul class="glance-list">${honors.map(h=>`
      <li class="glance-honor ${h.kind}">
        <span class="glance-honor-icon"><i class="ti ${h.icon}" aria-hidden="true"></i></span>
        <span><span class="glance-honor-t">${escapeHTML(h.title)}</span><span class="glance-honor-s">${escapeHTML([h.org, h.date].filter(Boolean).join(' · '))}</span></span>
      </li>`).join('')}</ul></div>`);
  }

  const projs=MAIN_PROJECT_IDS.map(id=>PROJECTS[id]).filter(Boolean);
  if(projs.length){
    parts.push(`<div><div class="glance-label">Featured Projects</div><ul class="glance-list">${projs.map(p=>{
      const thumb=(p.media||[]).map(m=>m.thumbnail || (m.type==='image' ? m.src : '')).find(Boolean);
      const badge=(p.badges||[]).find(b=>b.type==='primary');
      return `<li><button type="button" class="glance-proj" data-id="${escapeHTML(p.id)}" aria-label="${escapeHTML(p.title)} 프로젝트 보기">
        ${thumb ? `<img class="glance-proj-thumb" src="${escapeHTML(thumb)}" alt="" loading="lazy">` : '<span class="glance-proj-thumb"></span>'}
        <span style="min-width:0"><span class="glance-proj-t">${escapeHTML(p.title)}</span><span class="glance-proj-s">${escapeHTML(p.subtitle||'')}</span></span>
        ${badge ? `<span class="glance-proj-badge">${escapeHTML(badge.text)}</span>` : '<i class="ti ti-chevron-right glance-proj-arrow" aria-hidden="true"></i>'}
      </button></li>`;}).join('')}</ul></div>`);
  }

  if(!parts.length){ el.hidden=true; return; }
  el.innerHTML=parts.join('');
  el.hidden=false;
  el.querySelectorAll('.glance-proj').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.id;
    if(canShowProjectDetail(id)) { showDetail(id); return; }
    const card=document.querySelector(`.proj-show-more[data-id="${id}"]`)?.closest('.project-card, .sub-project-card');
    (card || document.getElementById('projects'))?.scrollIntoView({behavior:'smooth', block:'start'});
  }));
}

function buildAwards(){
  const grid = document.getElementById('awards-col-grid');
  if(!grid) return;

  function detectMilestoneKind(item){
    const t = `${item.title || ''} ${item.org || ''}`.toLowerCase();
    if(t.includes('unijam') || t.includes('잼')) return 'jam';
    if(t.includes('전시') || t.includes('playx4') || t.includes('unicon') || t.includes('창립제') || t.includes('박람회')) return 'exhibition';
    if(t.includes('메토링') || t.includes('nexon')) return 'program';
    return 'activity';
  }

  const activities = (AWARDS.대외활동 || []).map(item => ({ ...item, kind: detectMilestoneKind(item) }));
  const awards = (AWARDS.수상 || []).map(item => ({ ...item, kind: 'award' }));
  const certs = (AWARDS.시험및자격증 || []).map(item => ({ ...item, kind: 'cert' }));

  const KIND = {
    award:      { label:'AWARD',      icon:'ti-trophy',          cls:'award' },
    exhibition: { label:'EXHIBITION', icon:'ti-device-gamepad-2', cls:'exhibition' },
    jam:        { label:'GAME JAM',   icon:'ti-bolt',            cls:'jam' },
    program:    { label:'PROGRAM',    icon:'ti-users',           cls:'program' },
    cert:       { label:'CERT',       icon:'ti-certificate',     cls:'cert' },
    activity:   { label:'ACTIVITY',   icon:'ti-flag',            cls:'activity' },
  };

  function renderNode(item){
    const meta = KIND[item.kind] || KIND.activity;
    return `
      <div class="milestone-node ${meta.cls}">
        <div class="milestone-dot"><i class="ti ${meta.icon}" aria-hidden="true"></i></div>
        <div class="milestone-body">
          <div class="milestone-node-title">${item.url ? `<a class="milestone-source" href="${item.url}" target="_blank" rel="noopener">${item.title}</a>` : item.title}</div>
          <div class="milestone-node-org">${item.org} · ${item.date}</div>
          ${item.validity ? `<div class="milestone-validity">${item.validity}</div>` : ''}
        </div>
        <div class="milestone-badge">${meta.label}</div>
      </div>`;
  }

  const groups = [
    { title:'Activities', icon:'ti-flag', items:activities, cls:'activities' },
    { title:'Awards', icon:'ti-trophy', items:awards, cls:'awards' },
    { title:'Certificates', icon:'ti-certificate', items:certs, cls:'certificates' },
  ];

  function renderCategory(group){
    const items = [...group.items].sort((a,b)=>b.date.localeCompare(a.date));
    return `
      <section class="milestone-category ${group.cls}">
        <div class="milestone-category-head">
          <div class="milestone-category-title"><i class="ti ${group.icon}" aria-hidden="true"></i>${group.title}</div>
          <div class="milestone-category-count">${items.length}</div>
        </div>
        <div class="milestone-category-list">
          ${items.map(renderNode).join('')}
        </div>
      </section>`;
  }

  grid.className = 'milestone-timeline';
  grid.innerHTML = `
    <div class="milestone-map">
      <div class="milestone-summary">${MILESTONE_SUMMARY.map(item=>`<span>${item.label}</span><strong>${item.value}</strong>`).join('')}</div>
      <div class="milestone-category-grid">${groups.map(renderCategory).join('')}</div>
    </div>
  `;
}

function makeSlider(media,cont,dots,prev,next,preload='metadata'){
  let cur=0; const sl=[];
  media.forEach((m,i)=>{
    const s=document.createElement('div'); s.className='proj-slide'+(i===0?' active':'');
    s.innerHTML=m.src?(m.type==='video'?`
                <video controls muted playsinline preload="${preload}" poster="${m.thumbnail}">
                  <source src="${m.src}" type="video/mp4">
                </video>
              `:`<img src="${m.src}" alt="${m.label}" loading="lazy">`):`<div class="slide-placeholder">${m.type==='video'?IC.vid:IC.img}<span>${m.label}</span></div>`;
    if(m.label){const b=document.createElement('div');b.className='slide-type-badge';b.textContent=m.label;s.appendChild(b);}
    cont.appendChild(s); sl.push(s);
  });
  media.forEach((_,i)=>{
    const d=document.createElement('div'); d.className='slider-dot'+(i===0?' active':'');
    d.addEventListener('click',()=>go(i)); dots.appendChild(d);
  });
  function go(n){
    sl[cur].classList.remove('active');
    dots.children[cur].classList.remove('active');
    cur=(n+sl.length)%sl.length;
    sl[cur].classList.add('active');
    dots.children[cur].classList.add('active');
    syncProjectVideos();
  }
  if(prev)prev.addEventListener('click',e=>{e.stopPropagation();go(cur-1);});
  if(next)next.addEventListener('click',e=>{e.stopPropagation();go(cur+1);});
}

function pauseVideos(scope=document){
  scope.querySelectorAll('video').forEach(video=>{
    video.pause();
  });
}

function visibleRatio(el){
  if(!el) return 0;
  const rect=el.getBoundingClientRect();
  const visibleW=Math.max(0, Math.min(rect.right, window.innerWidth) - Math.max(rect.left, 0));
  const visibleH=Math.max(0, Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0));
  const area=Math.max(1, rect.width * rect.height);
  return (visibleW * visibleH) / area;
}

let activeProjectVideo=null;
function syncProjectVideos(){
  let next=null, bestScore=0;
  if(!document.hidden && !document.getElementById('detail-view').classList.contains('visible')){
    document.querySelectorAll('.project-card, .sub-project-card').forEach(card=>{
      const video=card.querySelector('.proj-slide.active video');
      if(!video) return;
      const ratio=visibleRatio(video);
      if(ratio < .5) return;
      const rect=video.getBoundingClientRect();
      const distance=Math.abs((rect.top+rect.bottom)/2-innerHeight/2)/innerHeight;
      // Keep the current video when two cards are equally visible to avoid playback churn.
      const score=ratio-distance*.2+(video===activeProjectVideo?.video ? .05 : 0);
      if(score>bestScore){bestScore=score;next=video;}
    });
  }
  if(next===activeProjectVideo?.video || (!next && !activeProjectVideo)) return;
  if(activeProjectVideo){activeProjectVideo.video.pause();activeProjectVideo=null;}
  if(!next) return;
  const selection={video:next};
  activeProjectVideo=selection;
  next.play().then(()=>{
    // An old play request may finish after scrolling to another card.
    if(activeProjectVideo!==selection && activeProjectVideo?.video!==next) next.pause();
  }).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) pauseVideos();
  syncProjectVideos();
});
// Manual playback also hands off the decoder rather than starting a second card.
document.addEventListener('play',event=>{
  const video=event.target;
  if(!(video instanceof HTMLVideoElement) || !video.closest('.project-card, .sub-project-card')) return;
  if(document.hidden || document.getElementById('detail-view').classList.contains('visible')){video.pause();return;}
  document.querySelectorAll('.project-card video, .sub-project-card video').forEach(other=>{
    if(other!==video && !other.paused) other.pause();
  });
  if(activeProjectVideo?.video!==video) activeProjectVideo={video};
},true);

function getProjectBadges(p, max=3){
  if(!Array.isArray(p.badges)) return '';
  return p.badges
    .slice(0,max)
    .map(b=>`<span class="proj-badge ${b.type || 'sub'}">${b.text}</span>`)
    .join('');
}

function getFirstSentence(text){
  if(!text) return '';
  const match=String(text).match(/^.*?[.!?。](?=\s|$)/);
  return match ? match[0] : text;
}

function createProjectCard(p, idx, variant='main'){
  const card=document.createElement('article');
  card.className=variant==='sub'
    ? 'sub-project-card'
    : 'project-card'+(idx%2===1?' reverse':'');
  const mw=document.createElement('div'); mw.className='proj-media';
  const sl=document.createElement('div'); sl.className='proj-slider';
  const dw=document.createElement('div'); dw.className='slider-dots';
  const pb=document.createElement('button'); pb.className='slider-btn'; pb.setAttribute('aria-label','이전'); pb.innerHTML=`<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>`;
  const nb=document.createElement('button'); nb.className='slider-btn'; nb.setAttribute('aria-label','다음'); nb.innerHTML=`<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>`;
  const nr=document.createElement('div'); nr.className='slider-nav'; nr.append(pb,dw,nb);
  mw.append(sl,nr); makeSlider(p.media,sl,dw,pb,nb,variant==='sub'?'none':'metadata');
  const info=document.createElement('div'); info.className='proj-info';
  const metaLine=(variant==='sub'
    ? [p.meta.engine, p.meta.team]
    : [p.meta.engine, p.meta.platform, p.meta.team]
  ).filter(Boolean).join(' · ');
  const th=(p.tags||[]).slice(0,3).map(t=>`<span class="proj-tag">${t}</span>`).join('');
  const badges=getProjectBadges(p, 3);
  const summary=variant==='sub' ? getFirstSentence(p.summary) : p.summary;
  const showMoreEnabled=canShowProjectDetail(p);
  const moreButton=showMoreEnabled?`<button class="proj-show-more" data-id="${p.id}">Show more ${IC.arr}</button>`:'';
  info.innerHTML=variant==='sub'?`
    <div class="sub-project-heading">
      <div class="proj-index">${p.meta.year||''}</div>
      ${badges?`<div class="proj-badges">${badges}</div>`:''}
    </div>
    <h3 class="proj-title">${p.title}</h3>
    <div class="proj-meta-line">${metaLine}</div>
    <div class="sub-project-footer"><p class="proj-summary">${summary}</p>${moreButton}</div>`:`
    <div class="proj-index">${p.meta.year||''}</div>
    ${badges?`<div class="proj-badges">${badges}</div>`:''}
    <h3 class="proj-title">${p.title}</h3>
    ${variant==='main'?`<div class="proj-subtitle">${p.subtitle||''}</div>`:''}
    ${variant==='main' && th?`<div class="proj-tags">${th}</div>`:''}
    <div class="proj-meta-line">${metaLine}</div>
    <p class="proj-summary">${summary}</p>
    ${moreButton}`;
  card.append(mw,info);
  return card;
}

function canShowProjectDetail(projectOrId){
  const p=typeof projectOrId==='string' ? PROJECTS[projectOrId] : projectOrId;
  return !!p && p.showMore !== false && p.detail?.showMore !== false;
}

function buildProjects(){
  const list=document.getElementById('projects-list');
  list.innerHTML='';
  const mainWrap=document.createElement('div');
  mainWrap.className='projects-main';
  MAIN_PROJECT_IDS.forEach((id,idx)=>{
    const p=PROJECTS[id]; if(!p)return;
    mainWrap.appendChild(createProjectCard(p, idx, 'main'));
  });
  list.appendChild(mainWrap);

  if(SUB_PROJECT_IDS.length){
    const sub=document.createElement('section');
    sub.className='projects-sub';
    sub.innerHTML=`
      <div class="projects-sub-head">
        <div class="projects-group-label">Sub Projects / Demo</div>
      </div>
      <div class="sub-project-grid" aria-label="보조 프로젝트"></div>`;
    const track=sub.querySelector('.sub-project-grid');
    SUB_PROJECT_IDS.forEach((id,idx)=>{
      const p=PROJECTS[id]; if(!p)return;
      const card=createProjectCard(p, idx, 'sub');
      card.dataset.subIndex=idx;
      track.appendChild(card);
    });
    list.appendChild(sub);
  }

  document.querySelectorAll('.proj-show-more').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();showDetail(b.dataset.id);});
  });
}

let _currentDetailId = null;

function stripHTML(html){
  return String(html||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
}

function getStrongText(html){
  const match=String(html||'').match(/<strong>([\s\S]*?)<\/strong>/);
  return match ? stripHTML(match[1]) : stripHTML(html);
}

function getListItems(html, max=2){
  return [...String(html||'').matchAll(/<li>([\s\S]*?)<\/li>/g)]
    .slice(0,max)
    .map(m=>stripHTML(m[1]));
}

function resolveProjectLink(p, slot){
  const detail=p.detail || {};
  if(slot==='팀 문서'){
    const wanted=detail.linkMap?.[slot] || detail.linkMap?.Document || detail.linkMap?.Documentation || 'Google Drive';
    return (p.links||[]).find(l=>[wanted,'팀 문서','Document','Documentation'].includes(l.label)) || null;
  }
  const wanted=detail.linkMap?.[slot] || slot;
  return (p.links||[]).find(l=>l.label===wanted || l.label===slot) || null;
}

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function renderCodeLink(item){
  if(!item.codeUrl) return '';
  try{
    const url=new URL(item.codeUrl);
    if(url.protocol!=='https:' || url.hostname!=='github.com') return '';
    const label=escapeHTML(`${item.title} · ${item.codeLabel || 'GitHub 샘플 코드'}`);
    return `<a class="code-link" href="${escapeHTML(url.href)}" target="_blank" rel="noopener" title="${label}" aria-label="${label}"><i class="ti ti-brand-github" aria-hidden="true"></i></a>`;
  }catch{return '';}
}

function renderFeedbackSource(source, url){
  if(!source) return '';
  const text=escapeHTML(source);
  // Source is optional; never infer an event or speaker from a feedback sentence.
  if(url && /^https?:\/\//.test(url)) return `<a class="feedback-citation" href="${escapeHTML(url)}" target="_blank" rel="noopener">${text}</a>`;
  return `<span class="feedback-citation">${text}</span>`;
}

function renderTechnicalDecisions(p) {
  if (!Array.isArray(p.technicalDecisions) || !p.technicalDecisions.length) return '';

  return `
    <div class="detail-section" id="detail-decisions">
      <div class="detail-section-label">Technical Decisions</div>
      <div class="detail-qa-list">
        ${p.technicalDecisions.map(item => `
          <div class="detail-qa-item">
            <div class="detail-qa-q">${item.q}</div>
            <div class="detail-qa-a">${item.a}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// 목표가 없으면 빈 문자열을 돌려주고, Overview의 Goal 블록을 숨긴다.
function getProjectGoal(p){
  if(typeof p.goal === 'string') return p.goal;
  if(Array.isArray(p.goal) && p.goal.length) return p.goal[0];
  return '';
}

function renderDetailOverview(p) {
  const detail=p.detail || {};
  const goal=getProjectGoal(p);
  const techStack = Array.isArray(detail.techStack) && detail.techStack.length
    ? detail.techStack
    : [p.meta.engine, ...(p.tags||[])].filter(Boolean);
  const infoHTML=Object.entries(p.meta).map(([k,v])=>`
    <div class="detail-info-item">
      <span class="detail-info-key">${k}</span>
      <span class="detail-info-val">${v}</span>
    </div>`).join('');
  const linksHTML=DETAIL_LINK_SLOTS.map(slot=>{
    const link=resolveProjectLink(p, slot);
    return link
      ? `<a class="detail-overview-link" href="${link.url}" target="_blank" rel="noopener"><span>${slot}</span>${IC.ext}</a>`
      : '';
  }).join('');
  const roleHTML = Array.isArray(p.role)
    ? `<div class="role-cards">${p.role.map((r,i)=>`
        <div class="role-card${i===0?' role-primary':''}">
          <div class="role-card-header">
            <i class="ti ${r.icon||'ti-code'} role-card-icon" aria-hidden="true"></i>
            <span class="role-card-name">${r.name}</span>
          </div>
          <div class="role-card-desc">${r.desc}</div>
        </div>`).join('')}</div>`
    : `<div class="detail-section-text">${p.role}</div>`;

  return `
    <section class="detail-section detail-overview-section" id="detail-overview">
      <div class="detail-section-label">Overview</div>

      <div class="detail-overview-layout">
        <div class="detail-overview-group">
          <div class="detail-overview-label">Tech Stack</div>
          <div class="detail-overview-chips">
            ${techStack.map(item => `<span>${item}</span>`).join('')}
          </div>
        </div>
        <div class="detail-overview-group">
          <div class="detail-overview-label">Project Info</div>
          <div class="detail-info-grid">${infoHTML}</div>
        </div>
        <div class="detail-overview-group">
          <div class="detail-overview-label">My Role</div>
          ${roleHTML}
        </div>
        ${goal ? `<div class="detail-overview-hero">
          <div class="detail-overview-kicker">Goal</div>
          <p class="detail-overview-goal">${escapeHTML(goal)}</p>
        </div>` : ''}
        <div class="detail-overview-group">
          <div class="detail-overview-label">Links</div>
          <div class="detail-overview-links">${linksHTML}</div>
        </div>
      </div>
    </section>
  `;
}

function showDetail(id){
  const p=PROJECTS[id]; if(!p)return;
  if(!canShowProjectDetail(p)) return;
  const isMainDetail=MAIN_PROJECT_IDS.includes(id);
  const isSubDetail=SUB_PROJECT_IDS.includes(id);
  if(!isMainDetail && !isSubDetail) return;
  pauseVideos();
  activeProjectVideo=null;
  _currentDetailId = id;
  document.getElementById('d-eyebrow').textContent=p.meta.year+' · '+p.meta.engine;
  document.getElementById('d-title').textContent=p.title;
  document.getElementById('d-subtitle').textContent=p.subtitle;

  const dm=document.getElementById('d-media'); dm.innerHTML='';
  const dd=document.getElementById('d-dots'); dd.innerHTML='';
  let dc=0; const ds=[];
  p.media.forEach((m,i)=>{
    const s=document.createElement('div'); s.className='detail-media-slide'+(i===0?' active':'');
    s.innerHTML=m.src?(m.type==='video'?`
    <video controls autoplay muted playsinline preload="metadata"${m.thumbnail?` poster="${escapeHTML(m.thumbnail)}"`:''}>
      <source src="${m.src}" type="video/mp4">
    </video>
    `:`<img src="${m.src}" alt="${m.label}">`):`<div class="slide-placeholder">${m.type==='video'?IC.vid:IC.img}<span>${m.label}</span></div>`;
    dm.appendChild(s); ds.push(s);
    const d=document.createElement('div'); d.className='slider-dot'+(i===0?' active':'');
    d.addEventListener('click',()=>dgo(i)); dd.appendChild(d);
  });
  function dgo(n){ds[dc].classList.remove('active');dd.children[dc].classList.remove('active');dc=(n+ds.length)%ds.length;ds[dc].classList.add('active');dd.children[dc].classList.add('active');}
  document.getElementById('d-prev').onclick=()=>dgo(dc-1);
  document.getElementById('d-next').onclick=()=>dgo(dc+1);
  document.getElementById('d-sidebar').innerHTML='';

  // 본문 섹션들
  const main = document.getElementById('d-main');
  main.innerHTML = '';

  const sections = [];

  // 0. Project Overview
  sections.push(renderDetailOverview(p));

  // 2. Activities (있을 때만)
  if(p.activities && p.activities.length){
    const tagsHTML=p.activities.map(a=>`<span class="ow-tag">${a}</span>`).join('');
    sections.push(`<div class="detail-section" id="detail-activities">
      <div class="detail-section-label">Activities</div>
      <div class="ow-tags">${tagsHTML}</div>
    </div>`);
  }

  // 3. Technical Contributions
  // 카테고리 → 아이콘 + 뱃지 레이블 맵
  const CONTRIB_CATS = {
    '인증':       { icon:'ti-lock',            label:'인증',       color:'#92600a', bg:'#fdf3dc' },
    '백엔드':     { icon:'ti-server',           label:'백엔드',     color:'#1e5fa8', bg:'#ddeaf8' },
    'DB':         { icon:'ti-database',         label:'DB',         color:'#1e5fa8', bg:'#ddeaf8' },
    '네트워크':   { icon:'ti-wifi',             label:'네트워크',   color:'#1e5fa8', bg:'#ddeaf8' },
    '게임플레이': { icon:'ti-sword',            label:'게임플레이', color:'#4535b0', bg:'#e8e5fa' },
    '기믹':       { icon:'ti-rotate-rectangle', label:'기믹',       color:'#4535b0', bg:'#e8e5fa' },
    '물리':       { icon:'ti-atom-2',           label:'물리',       color:'#4535b0', bg:'#e8e5fa' },
    '그래픽':     { icon:'ti-brush',            label:'그래픽',     color:'#0e7070', bg:'#d8f2f0' },
    '셰이더':     { icon:'ti-sparkles',         label:'셰이더',     color:'#0e7070', bg:'#d8f2f0' },
    'UI':         { icon:'ti-layout-cards',     label:'UI',         color:'#7030b8', bg:'#eedff8' },
    'UX':         { icon:'ti-accessible',       label:'UX',         color:'#7030b8', bg:'#eedff8' },
    '사운드':     { icon:'ti-volume',           label:'사운드',     color:'#0e7070', bg:'#d8f2f0' },
    '저장':       { icon:'ti-device-floppy',    label:'저장',       color:'#92600a', bg:'#fdf3dc' },
    '최적화':     { icon:'ti-bolt',             label:'최적화',     color:'#a02030', bg:'#f8dde0' },
    '빌드':       { icon:'ti-settings',         label:'빌드',       color:'#5a5285', bg:'#eae8f5' },
    '구조':       { icon:'ti-sitemap',          label:'구조',       color:'#5040c8', bg:'#e4e1f8' },
    '에디터':     { icon:'ti-tool',             label:'에디터',     color:'#5a5285', bg:'#eae8f5' },
    'AI':         { icon:'ti-cpu',              label:'AI',         color:'#5040c8', bg:'#e4e1f8' },
    '기획':       { icon:'ti-pencil',           label:'기획',       color:'#5a5285', bg:'#eae8f5' },
    '플랫폼': { icon:'ti-device-gamepad-2', label:'플랫폼', color:'#5a5285', bg:'#eae8f5' },
  };
  const DEFAULT_CAT = { icon:'ti-code-dots', label:'', color:'#5a5285', bg:'#eae8f5' };

  function contribSummaryCard(c){
    const cat = c.category ? (CONTRIB_CATS[c.category] || DEFAULT_CAT) : DEFAULT_CAT;
    const badgeHTML = cat.label
      ? `<span class="contribution-badge" style="background:${cat.bg};color:${cat.color};border-color:${cat.color}33;">${cat.label}</span>` : '';
    const lead=getStrongText(c.desc);
    const items=[lead, ...getListItems(c.desc, 2)].filter(Boolean);
    const goal=c.goal || lead;
    const solutions=Array.isArray(c.solution) ? c.solution : getListItems(c.desc, 2);
    const imageHTML=Array.isArray(c.images) && c.images.length
      ? `<div class="contribution-summary-media">${c.images.map((image,idx)=>{
        const item=typeof image==='string' ? { src:image } : image;
        if(!item?.src) return '';
        return `<img src="${item.src}" alt="${item.alt || `${c.title} image ${idx+1}`}" loading="lazy">`;
      }).join('')}</div>`
      : '';
    return `<div class="contribution-summary${imageHTML?' has-media':''}">
      ${imageHTML}
      <div class="contribution-summary-head">
        <div class="contribution-summary-icon"><i class="ti ${cat.icon}" aria-hidden="true"></i></div>
        <div class="contribution-summary-title">${c.title}</div>
        ${badgeHTML}
        ${renderCodeLink(c)}
      </div>
      ${c.goal?`<dl class="contribution-steps">
        <div class="contribution-step"><dt>목표</dt><dd>${escapeHTML(goal)}</dd></div>
        <div class="contribution-step"><dt>해결</dt><dd><ul>${solutions.map(text=>`<li>${escapeHTML(text)}</li>`).join('')}</ul></dd></div>
      </dl>`:items.length?`<ul class="contribution-summary-list">${items.map(item=>`<li>${item}</li>`).join('')}</ul>`:''}
    </div>`;
  }

  function flowCard(title, steps, extraClass='', codeItem=null){
    return `<div class="flow-card ${extraClass}">
      ${title?`<div class="flow-card-title"><span>${title}</span>${codeItem?renderCodeLink(codeItem):''}</div>`:''}
      <div class="flow-row" style="--flow-count:${steps.length}">
        ${steps.map((step,idx)=>`<div class="flow-cell flow-step-${idx}">
          ${extraClass==='feedback-flow-card' && idx===0?'<i class="ti ti-quote feedback-quote-mark" aria-hidden="true"></i>':''}
          <div class="flow-label">${step.label}</div>
          <div class="flow-text">${step.text}</div>
          ${renderFeedbackSource(step.source,step.sourceUrl)}
        </div>`).join('')}
      </div>
    </div>`;
  }

  function optimizationCard(opt, idx){
    const detail=(p.detail?.optimizations || [])[idx] || {};
    const bullets=getListItems(opt.desc, 3);
    const comparison=opt.comparison || {};
    const images=[['Before', comparison.before], ['After', comparison.after]]
      .filter(([,image])=>image?.src)
      .map(([label,image])=>{
        // Crop only the displayed top region; the link keeps the original evidence intact.
        const crop=image.crop;
        const cropped=Number.isFinite(crop?.width) && crop.width>0
          && Number.isFinite(crop?.height) && crop.height>0;
        const cropAttributes=cropped
          ? ` class="optimization-crop" style="aspect-ratio:${crop.width}/${crop.height}"` : '';
        return `<figure><a${cropAttributes} href="${escapeHTML(image.src)}" target="_blank" rel="noopener" title="원본 이미지 보기" aria-label="${escapeHTML(`${opt.title} · ${label} 원본 이미지 보기`)}"><img src="${escapeHTML(image.src)}" alt="${escapeHTML(image.alt || `${opt.title} — ${label}`)}" loading="lazy"></a><figcaption><strong>${label}</strong>${escapeHTML(image.caption || '')}</figcaption></figure>`;
      }).join('');
    const flow=flowCard(opt.title, [
      { label:'측정', text:detail.measurement || bullets[0] || getStrongText(opt.desc) },
      { label:'원인', text:detail.cause || bullets[1] || '반복 비용과 상태 복잡도가 커지는 지점을 확인' },
      { label:'개선', text:detail.improvement || bullets[2] || getStrongText(opt.desc) },
      { label:'결과', text:detail.result || '동일 기능을 더 예측 가능한 흐름으로 정리' },
    ], '', opt);
    return images ? flow.replace(/<\/div>$/, `<div class="optimization-comparison${comparison.layout==='stacked'?' stacked':''}">${images}</div></div>`) : flow;
  }

  function troubleshootingCard(item){
    return flowCard(item.title || 'Troubleshooting', [
      { label:'문제', text:item.problem || '' },
      { label:'원인', text:item.cause || '' },
      { label:'해결', text:item.solution || '' },
      { label:'결과', text:item.result || '' },
    ], '', item);
  }

  const contributions = Array.isArray(p.contributions) ? p.contributions : [];
  const coreCount = Number.isFinite(p.detail?.coreContributionCount)
    ? p.detail.coreContributionCount
    : Math.min(3, contributions.length);
  const coreContributions = contributions.slice(0, coreCount);
  const additionalContributions = contributions.slice(coreCount);
  const renderContributionGroup = (title, items, cls) => items.length ? `
    <div class="contribution-group ${cls}">
      <div class="contribution-group-head">${title}<span class="contribution-group-count">${items.length}</span></div>
      <div class="contributions">${items.map(contribSummaryCard).join('')}</div>
    </div>` : '';
  const contribHTML = `
    <div class="contribution-groups">
      ${renderContributionGroup('Core', coreContributions, 'core')}
      ${renderContributionGroup('Additional', additionalContributions, 'additional')}
    </div>`;
  sections.push(`<div class="detail-section" id="detail-contributions">
    <div class="detail-section-label">Technical Contributions</div>
    ${contribHTML}
  </div>`);

  if(isMainDetail && p.troubleshooting && p.troubleshooting.length){
    const troubleHTML=p.troubleshooting.map(troubleshootingCard).join('');
    sections.push(`<div class="detail-section" id="detail-troubleshooting">
      <div class="detail-section-label">Troubleshooting</div>
      <div class="troubleshooting-list">${troubleHTML}</div>
    </div>`);
  }

  if(isMainDetail){
    const decisionsHTML = renderTechnicalDecisions(p);
    if (decisionsHTML) sections.push(decisionsHTML);

    // 4. Optimizations (있을 때만)
    if(p.optimizations && p.optimizations.length){
      const optHTML = p.optimizations.map(optimizationCard).join('');
      sections.push(`<div class="detail-section" id="detail-optimization">
        <div class="detail-section-label">Optimization</div>
        <div class="optimization-list">${optHTML}</div>
      </div>`);
    }

    // 5. 유저 피드백 (그래프 + 개선 흐름, 각각 없어도 됨)
    if(p.feedback && (p.feedback.graphs?.length || p.feedback.quotes?.length || p.feedback.length)){
      // 하위 호환: p.feedback이 배열이면 graphs로 취급
      const graphs = Array.isArray(p.feedback) ? p.feedback : (p.feedback.graphs || []);
      const quotes = Array.isArray(p.feedback) ? [] : (p.feedback.quotes || []);
      const iterations = p.detail?.feedbackIterations || [];

      const graphHTML = graphs.length ? `<div class="feedback-chart">${graphs.map(f=>{
        const pct = Math.round(f.value / f.max * 100);
        return `<div class="feedback-row">
          <div class="feedback-label-wrap">
            <div class="feedback-label">${f.label}</div>
            ${f.source ? `<div class="feedback-source">${f.source}</div>` : ''}
          </div>
          <div class="feedback-bar-wrap"><div class="feedback-bar" style="width:0" data-pct="${pct}"></div></div>
          <div class="feedback-val">${f.value}${f.unit}</div>
        </div>`;
      }).join('')}</div>` : '';

      const iterationHTML = iterations.length ? `<div class="feedback-iteration-list">${iterations.map(item=>
        flowCard('', [
          { label:'Feedback', text:item.feedback, source:item.source, sourceUrl:item.sourceUrl },
          { label:'Improvement', text:item.improvement },
        ], 'feedback-flow-card')).join('')}</div>` : '';

      const quoteHTML = quotes.length && !iterations.length ? `<div class="feedback-quotes">${quotes.map(q=>`
        <div class="feedback-quote">
          <i class="ti ti-quote feedback-quote-mark" aria-hidden="true"></i>
          <div class="feedback-quote-text">${q.text}</div>
          ${renderFeedbackSource(q.source || q.author,q.sourceUrl)}
        </div>`).join('')}</div>` : '';

      sections.push(`<div class="detail-section" id="detail-feedback">
        <div class="detail-section-label">User Feedback & Iteration</div>
        ${graphHTML}${iterationHTML}${quoteHTML}
      </div>`);
    }
  }

  // 6. Retrospective
  if(p.retrospective){
    const r=p.retrospective;
    const retroImgHTML = r.images && r.images.length
      ? `<div class="retro-images">${r.images.map(src=>`<img src="${src}" alt="retrospective">`).join('')}</div>` : '';
    sections.push(`<div class="detail-section" id="detail-retrospective">
      <div class="detail-section-label">Retrospective</div>
      <div class="retro-grid">
        <div class="retro-card good">
          <div class="retro-card-label">What went well</div>
          <div class="retro-card-text">${r.good}</div>

  }

  // 6. Other Contributions (있을 때만)
  /*
  if(isMainDetail && p.other_contributions){
    const otherHTML = Array.isArray(p.other_contributions)
      ? p.other_contributions.map(contribCard).join('')
      : `<div class="detail-section-text">${p.other_contributions}</div>`;

  }
  */

    const otherHTML=p.other_contributions.map(a=>`<span class="ow-tag">${a.title}</span>`).join('');

  main.innerHTML = sections.join('');
  const tocLinks=Array.from(main.querySelectorAll('.detail-section[id]')).map(section=>{

  document.getElementById('d-sidebar').innerHTML=`

  // 피드백 바 애니메이션
  requestAnimationFrame(()=>{
    main.querySelectorAll('.feedback-bar[data-pct]').forEach(bar=>{
      requestAnimationFrame(()=>{ bar.style.width = bar.dataset.pct + '%'; });

  // 하단 네비 버튼
  const detailOrder=(isSubDetail ? SUB_PROJECT_IDS : MAIN_PROJECT_IDS).filter(canShowProjectDetail);
  const idx=detailOrder.indexOf(id);
  const prevId=idx>0?detailOrder[idx-1]:null;
  const nextId=idx>-1 && idx<detailOrder.length-1?detailOrder[idx+1]:null;
  const prevTitle=prevId?PROJECTS[prevId].title:'';
  const nextTitle=nextId?PROJECTS[nextId].title:'';
  const navRow=document.getElementById('d-nav-row');
  navRow.innerHTML=`
    <button class="detail-nav-btn" onclick="showDetail('${prevId}')" ${!prevId?'disabled':''}>

    </button>

      ${nextId?nextTitle:''}

    </button>`;

  document.getElementById('list-view').style.display='none';
  document.getElementById('detail-view').classList.add('visible');

}

// 섹션: 뷰포트 중심에 가장 가까운 섹션 하나에만 라이트 효과
const sections = Array.from(document.querySelectorAll('#about, #skills, #awards, #projects'));
sections.forEach(el => el.classList.add('section-highlight'));

// 프로젝트 카드: 뷰포트 중심에 가장 가까운 카드 하나만 scale up
function getCards(){ return Array.from(document.querySelectorAll('.project-card')); }

function getClosest(els){
  const vh = window.innerHeight;
  const mid = vh / 2;
  let best = null, bestScore = -Infinity;
  els.forEach(el => {
    const rect = el.getBoundingClientRect();
    const visTop = Math.max(rect.top, 0);
    const visBot = Math.min(rect.bottom, vh);
    const visible = Math.max(0, visBot - visTop);
    if(visible <= 0) return;
    // 항목 자체 높이 대비 보이는 비율 (짧은 항목 보호)
    const ratio = visible / Math.min(rect.height, vh);
    // 중심이 화면 중앙에 가까울수록 보너스
    const elMid = rect.top + rect.height / 2;
    const centerBonus = 1 - Math.min(Math.abs(elMid - mid) / vh, 1);
    // 비율을 최우선, 절대 픽셀은 보조
    const score = ratio * 200 + centerBonus * 60 + visible * 0.1;
    if(score > bestScore){ bestScore = score; best = el; }
  });
  return best;
}

const lightEl = document.getElementById('section-light');
let _prevSection = null;
let _prevCard = null;
let _prevDetail = null;

function setLight(target){
  if(!target){
    lightEl.classList.remove('visible');
    _prevSection = null;
    return;
  }
  const r = target.getBoundingClientRect();
  const nextHr = target.nextElementSibling;
  let bottom = r.bottom;
  if(nextHr && (nextHr.classList.contains('rule') || nextHr.tagName === 'HR')){
    bottom = nextHr.getBoundingClientRect().bottom;
  }
  lightEl.style.top = r.top + 'px';
  lightEl.style.height = (bottom - r.top) + 'px';
  lightEl.classList.add('visible');
}

let ticking = false;
function onScroll(){
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(()=>{
    const isDetail = document.getElementById('detail-view').classList.contains('visible');

    if(isDetail){
      // 상세 페이지: 하이라이트 없음
      lightEl.classList.remove('visible');
    } else {
      _prevDetail = null;

      // 섹션 하나만 (projects 제외 → light)
      const activeSection = getClosest(sections);
      sections.forEach(el => {
        const on = el === activeSection;
        if(on !== el.classList.contains('in-view')) el.classList.toggle('in-view', on);
      });

      if(activeSection !== _prevSection){
        _prevSection = activeSection;
        if(activeSection && activeSection.id !== 'projects'){
          lightEl.classList.remove('visible');
          // 위치 먼저 즉시 세팅, opacity만 fade
          const r = activeSection.getBoundingClientRect();
          const nextHr = activeSection.nextElementSibling;
          let bottom = r.bottom;
          if(nextHr && (nextHr.classList.contains('rule') || nextHr.tagName === 'HR')){
            bottom = nextHr.getBoundingClientRect().bottom;
          }
          lightEl.style.top = r.top + 'px';
          lightEl.style.height = (bottom - r.top) + 'px';
          requestAnimationFrame(()=> requestAnimationFrame(()=> lightEl.classList.add('visible')));
        } else {
          lightEl.classList.remove('visible');
        }
      } else if(activeSection && activeSection.id !== 'projects'){
        setLight(activeSection);
      }

      // 프로젝트 카드 — 뷰포트에 조금이라도 보이는 카드 중 중심에 가장 가까운 것
      const cards = getCards();
      if(cards.length){
        // 뷰포트에 보이는 카드가 하나라도 있으면 활성화
        const visibleCards = cards.filter(el => {
          const r = el.getBoundingClientRect();
          return r.bottom > 0 && r.top < window.innerHeight;
        });
        if(visibleCards.length){
          const activeCard = getClosest(cards);
          cards.forEach(el => {
            const on = el === activeCard;
            if(on !== el.classList.contains('in-view')) el.classList.toggle('in-view', on);
          });
        } else {
          cards.forEach(el => {
            el.classList.remove('in-view');
          });
        }
      }
    }

    syncProjectVideos();
    ticking = false;
  });
}

window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);
onScroll();


/* ── 파도 애니메이션 (rAF 픽셀 제어) ── */
(function(){
  const layers = [
    { id: '.fwsvg1', speed: 1.2, tile: 540, x: 0   },
    { id: '.fwsvg2', speed: 0.8, tile: 360, x: 0   },
    { id: '.fwsvg3', speed: 1.0, tile: 180, x: 0   },
  ];
  layers.forEach(l => { l.el = document.querySelector(l.id); });
  let last = null;
  function tick(ts) {
    const dt = last ? Math.min(ts - last, 32) : 16;
    last = ts;
    layers.forEach(l => {
      if (!l.el) return;
      l.x = (l.x + l.speed * (dt / 16)) % l.tile;
      l.el.style.transform = `translateX(${-l.x}px)`;
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
