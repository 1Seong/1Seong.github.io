<rect x="526" y="284" width="158" height="34" rx="6" class="row"/><text x="536" y="306" class="rt">기준별 test: · human:</text>

<rect x="709" y="200" width="178" height="202" rx="10" class="card"/>
<text x="798" y="228" text-anchor="middle" class="ct">PR · CI</text>
<rect x="719" y="244" width="158" height="34" rx="6" class="row"/><text x="729" y="266" class="rt">pr.py · PR 생성</text>
<rect x="719" y="284" width="158" height="34" rx="6" class="row"/><text x="729" y="306" class="rt">EditMode 테스트</text><rect x="837" y="291" width="32" height="20" rx="10" class="p-ci"/><text x="853" y="305" text-anchor="middle" class="pt-ci">CI</text>

<rect x="902" y="200" width="178" height="202" rx="10" class="card"/>
<text x="991" y="228" text-anchor="middle" class="ct">CI 판정 · pr.py</text>
<rect x="912" y="244" width="158" height="34" rx="6" class="row"/><text x="922" y="266" class="rt">wait · 검사 등록 대기</text>
