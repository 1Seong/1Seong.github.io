<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560" role="img" aria-labelledby="t d">
<title id="t">Detective A&amp;I 서버 경유 AI 호출</title>
<desc id="d">Unity WebGL 클라이언트(추리 중 대기 화면)에서 세 AI 단계가 InvokeAsync로 요청한다. SupabaseAnonymousAuthClient가 세마포어 안에서 토큰을 재확인하고 재사용, 갱신, 익명 발급 순서로 JWT를 준비한다. 요청은 익명 JWT를 붙여 Supabase Edge Function으로 가고, 401이면 토큰을 무효화하고 한 번만 재시도한다. Edge Function이 OpenAI 키와 프롬프트를 보관하고 OpenAI API를 호출한다. 클라이언트 빌드에는 OpenAI 키가 없다.</desc>
<!-- 근거: 1Seong/DetectiveAI portfolio/edge-client (원본 AIEdgeFunctionClient.cs·SupabaseAnonymousAuthClient.cs, 기준 커밋 57848cd). 서버 함수 본문은 샘플에 없다 -->
<style>
text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#0F172A}
.title{font-size:22px;font-weight:700}
.card{fill:#fff;stroke:#94A3B8;stroke-width:1.5}.ct{font-size:16px;font-weight:700}.cs{font-size:15px;fill:#475569}
.hl{fill:#EEF2FF;stroke:#6366F1;stroke-width:1.5}
.sb{fill:#ECFDF5;stroke:#059669;stroke-width:1.5}
.ext{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.5}
.mono{font-family:Consolas,'D2Coding',monospace;font-size:14px;font-weight:700;fill:#3730A3}
.lbl{font-size:14px;fill:#334155}
.note{font-size:14px;fill:#64748B}
.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
</defs>
<rect width="560" height="560" fill="#fff"/>
<text class="title" x="20" y="36">서버 경유 AI 호출</text>

<rect class="card" x="20" y="54" width="520" height="164" rx="12"/>
<text class="ct" x="36" y="80">Unity WebGL 클라이언트</text>
<clipPath id="cl"><rect x="36" y="92" width="220" height="124" rx="8"/></clipPath><image href="data:image/webp;base64," x="36" y="92" width="220" height="124" clip-path="url(#cl)" preserveAspectRatio="xMidYMid slice"/><rect x="36" y="92" width="220" height="124" rx="8" fill="none" stroke="#94A3B8" stroke-width="1.5"/>

<text class="ct" x="276" y="116">세 AI 단계</text>
<text class="mono" x="276" y="142">InvokeAsync&lt;T&gt;</text>
<text class="cs" x="276" y="166">인증·HTTP·JSON 변환을</text>
<text class="cs" x="276" y="188">한곳에 감춤</text>

<path class="flow" d="M280 218V244"/>
<rect class="hl" x="20" y="248" width="520" height="92" rx="12"/>
<text class="ct" x="36" y="276">SupabaseAnonymousAuthClient</text>
<text class="cs" x="36" y="300">세마포어 안에서 토큰을 다시 확인</text>
<text class="cs" x="36" y="324">재사용 → 갱신 → 익명 발급</text>

<path class="flow" d="M280 340V392"/>
<text class="lbl" x="292" y="364">익명 JWT · 401이면 1회 재시도</text>
<rect class="sb" x="20" y="396" width="330" height="96" rx="12"/>
<text class="ct" x="36" y="424">Supabase Edge Function</text>
<text class="cs" x="36" y="448">OpenAI 키·프롬프트 보관</text>
<text class="cs" x="36" y="472">(서버 본문은 샘플 미포함)</text>
<path class="flow" d="M350 444H376"/>
<rect class="ext" x="380" y="396" width="160" height="96" rx="12"/>
<text class="ct" x="398" y="440">OpenAI API</text>

<text class="note" x="20" y="530">클라이언트 빌드에는 OpenAI 키가 없음</text>
</svg>
