<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" role="img" aria-labelledby="t d">
<title id="t">UnityLoop CI 검증과 실패 원인 분류</title>
<desc id="d">프로필에서 ci.py가 GitHub Actions 워크플로를 만들어 대상 저장소에 둔다. 구현 뒤 verify.py가 로컬에서 범위, 테스트 수, 비밀값, Unity EditMode를 검사하고, evaluator가 기준별로 평가한 뒤 PR과 CI를 실행한다. pr.py가 CI 결과를 기다려 실패 로그를 대조하고, 코드 실패는 구현으로 되돌리며 인프라 실패는 사람에게 넘긴다.</desc>
<!-- 근거: 1Seong/UnityLoopInner scripts/verify.py, scripts/pr.py(INFRA_PATTERNS, wait), scripts/ci.py, ci-templates/unity-editmode/job.yml, docs/DECISIONS.md I-D14·I-D15 -->
<style>
text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#0F172A}
.title{font-size:22px;font-weight:700}.sub{font-size:13.5px;fill:#475569}.lg{font-size:12.5px;fill:#475569}
.lane{fill:#F8FAFC;stroke:#E2E8F0}.lt{font-size:15px;font-weight:700}.ls{font-size:12px;fill:#64748B}
.card{fill:#fff;stroke:#94A3B8;stroke-width:1.5}.ct{font-size:15px;font-weight:700}.cs{font-size:12.5px;fill:#475569}
.row{fill:#F1F5F9}.rt{font-size:13px;fill:#1E293B}
.mono{font-family:'Cascadia Code',Consolas,monospace;font-size:12.5px;fill:#1E293B}
.p-opus{fill:#6D28D9}.p-sonnet{fill:#1D4ED8}.p-code{fill:#475569}.p-ci{fill:#fff;stroke:#475569;stroke-dasharray:3 2}
.pt{font-size:11px;font-weight:600;fill:#fff}.pt-ci{font-size:11px;font-weight:600;fill:#475569}
.ok{fill:#ECFDF5;stroke:#059669;stroke-width:1.5}.okt{font-size:15px;font-weight:700;fill:#065F46}
.ask{fill:#FEF3C7;stroke:#D97706;stroke-width:1.5}.askt{font-size:15px;font-weight:700;fill:#92400E}
.no{fill:#FEF2F2;stroke:#DC2626;stroke-width:1.5}.not{font-size:15px;font-weight:700;fill:#B91C1C}
.bt{font-size:12.5px;fill:#334155}
.tag{fill:#fff;stroke:#D97706}.tagt{font-family:'Cascadia Code',Consolas,monospace;font-size:11px;fill:#92400E}
.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}
.line{fill:none;stroke:#334155;stroke-width:2}
.dash{fill:none;stroke:#334155;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#a)}
.loop{fill:none;stroke:#DC2626;stroke-width:2;marker-end:url(#ar)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DC2626"/></marker>
</defs>
<rect width="1100" height="580" fill="#fff"/>
<text x="10" y="34" class="title">CI 검증과 실패 원인 분류</text>
<text x="10" y="58" class="sub">사람 수락 전에 로컬 검증과 CI를 거치고, 다시 구현할 실패만 되돌림</text>
<g transform="translate(700,22)">
  <rect x="0" y="3" width="13" height="13" rx="3" class="p-sonnet"/><text x="19" y="14" class="lg">Sonnet</text>
  <rect x="80" y="3" width="13" height="13" rx="3" class="p-code"/><text x="99" y="14" class="lg">스크립트</text>
  <rect x="172" y="3" width="13" height="13" rx="3" class="p-ci"/><text x="191" y="14" class="lg">GitHub Actions</text>
  <rect x="300" y="3" width="13" height="13" rx="3" class="ask"/><text x="319" y="14" class="lg">사람</text>
</g>

