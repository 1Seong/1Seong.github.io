<text x="146" y="119" class="ct">프로젝트 프로필</text><text x="146" y="140" class="mono">projects/*.toml</text>
<rect x="400" y="94" width="270" height="62" rx="9" class="card"/>
<text x="416" y="119" class="ct">ci.py render · install</text><text x="416" y="140" class="cs">GameCI 템플릿 조립 · 액션 SHA 고정</text>
<rect x="710" y="94" width="370" height="62" rx="9" class="card"/>
<text x="726" y="119" class="ct">대상 저장소 워크플로</text><text x="726" y="140" class="cs">preflight가 프로필 일치 · 시크릿 이름 확인</text>
