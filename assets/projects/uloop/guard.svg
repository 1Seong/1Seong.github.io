<title id="t">UnityLoop 훅 기반 쓰기 범위와 외부 쓰기 가드</title>
<desc id="d">메인 세션과 서브에이전트 6종의 파일·셸·MCP·스킬 호출은 모두 PreToolUse 훅 5종 가운데 해당 훅을 거쳐 허용, 사람 확인, 차단으로 나뉜다. 사람 확인을 거친 외부 쓰기는 scripts/의 파이썬 스크립트만 Jira와 GitHub에 한다. 하네스가 실제 훅 입력으로 판정과 고정 스킬 해시를 시험한다.</desc>
