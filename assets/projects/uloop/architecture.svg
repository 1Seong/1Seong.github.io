<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="t d">
<title id="t">UnityLoop 이너 루프 전체 흐름</title>
<desc id="d">사람이 Jira 이슈를 고르면 이슈 읽기, 계획, 구현·검증, PR·CI를 거쳐 사람이 수락하고 머지·Jira 완료로 끝난다. 검증·평가·CI 실패나 수락 거절은 구현으로 되돌린다. state.py가 단계 순서와 재시도를 기록하고 스크립트 종료 코드로 다음 단계를 정한다.</desc>
<!-- 근거: 1Seong/UnityLoopInner .claude/skills/issue/SKILL.md, scripts/state.py, .claude/agents/*.md (2026-11-17). 클라이언트 등급 경로만 그린다. -->
<style>
text{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#0F172A}
.title{font-size:22px;font-weight:700}.sub{font-size:13.5px;fill:#475569}
.lg{font-size:12.5px;fill:#475569}
.lane{fill:#F8FAFC;stroke:#E2E8F0}.lt{font-size:15px;font-weight:700}.ls{font-size:12px;fill:#64748B}
.human{fill:#FEF3C7;stroke:#D97706;stroke-width:1.5}.ht{font-size:15px;font-weight:700;fill:#92400E}.hs{font-size:12.5px;fill:#92400E}
.card{fill:#fff;stroke:#94A3B8;stroke-width:1.5}.ct{font-size:16px;font-weight:700}
.row{fill:#F1F5F9}.rt{font-size:13px;fill:#1E293B}
.p-opus{fill:#6D28D9}.p-sonnet{fill:#1D4ED8}.p-haiku{fill:#047857}.p-code{fill:#475569}.p-ci{fill:#fff;stroke:#475569;stroke-dasharray:3 2}
.pt{font-size:11px;font-weight:600;fill:#fff}.pt-ci{font-size:11px;font-weight:600;fill:#475569}
.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}
.loop{fill:none;stroke:#DC2626;stroke-width:2;marker-end:url(#ar)}
.loopt{font-size:12.5px;font-weight:600;fill:#B91C1C}
.ctrl{fill:#1E293B}.ctrlt{font-size:14px;font-weight:600;fill:#fff}
</style>
<defs>
