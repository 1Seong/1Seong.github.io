<text class="cs" x="786" y="156">손님 판정·평판은 팀원 구현</text>
<text class="ok" x="786" y="180">처음 만든 메뉴 해금 호출</text>
<rect class="sb" x="770" y="216" width="280" height="96" rx="8"/>
<text class="ct" x="786" y="243">레시피북 · BookController</text>
<text class="cs" x="786" y="268">미등록 · 미발견 · 발견 구분</text>
<text class="cs" x="786" y="292">발견한 메뉴만 이름·맛 공개</text>

<path class="dash" d="M1050 150H1086V386H1076"/>
<text class="lbl" x="1048" y="350">해금</text>
<path class="dash" d="M910 358V316"/>
<text class="lbl" x="918" y="344">발견 여부</text>

<rect class="band" x="30" y="362" width="1040" height="52" rx="10"/>
<text class="bt" x="48" y="394">UnlockManager</text>
<text class="bs" x="190" y="394">재료·레시피 해금을 PlayerPrefs에 저장하고, 이벤트로 버튼 패널을 갱신 (사례 02)</text>
</svg>
