<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-labelledby="t d">
<title id="t">오,막하세! 레시피 데이터와 조합 조회 구조</title>
<desc id="d">레시피는 ScriptableObject 에셋으로 정의한다. RecipeBase가 조합 조건(기본 재료·조리법을 담은 CategoryData, 육류/생선, 채소)을 갖고, RecipeData가 이를 상속해 이름·맛·레시피북 이미지를 더한다. RecipeManager는 시작할 때 (Base, Cook, MeatFish, Vege) 튜플을 키로 딕셔너리를 만들고, GetRecipe가 RecipeData 또는 등록되지 않은 조합이면 null을 돌려준다. 조리 화면(CookManager, 손님 판정·평판은 팀원 구현)과 레시피북(BookController)이 같은 조회를 쓴다. 조리 화면은 처음 만든 메뉴를 UnlockManager에 해금하고, 레시피북은 UnlockManager에서 발견 여부를 확인한다.</desc>
<!-- 근거: 1Seong/OMakHase portfolio/recipe-system·recipe-book·unlock-ui (원본 기준 커밋 87c7ce2), CookManager.cs의 GetRecipe·UnlockRecipe 호출 -->
<style>
