<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <!-- UnityLoop Inner 전체 흐름. 근거: 1Seong/UnityLoopInner .claude/skills/issue/SKILL.md, CLAUDE.md, docs/STATUS.md(2026-11-17).
       클라이언트 등급 경로만 그린다(security_review는 server 등급에서만 실행). 배포 단계는 미구현이라 점선으로 둔다. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5040c8"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b0563f"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2f8f74"/>
    </marker>
  </defs>

  <!-- 사람: 이슈 선택 / 인프라 실패 보고 -->
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="18" width="340" height="52" rx="10" fill="#e6f6f0" stroke="#2f8f74" stroke-width="1.5"/>
    <text x="190" y="40" font-size="14" font-weight="600" fill="#17533f">사람이 Jira 이슈를 고름</text>
    <text x="190" y="59" fill="#2f6f5c">/issue KEY 실행 · 다음 이슈는 자동으로 안 가져옴</text>
    <rect x="600" y="18" width="300" height="52" rx="10" fill="#e6f6f0" stroke="#2f8f74" stroke-width="1.5"/>
    <text x="750" y="40" font-size="14" font-weight="600" fill="#17533f">인프라 실패는 멈추고 보고</text>
    <text x="750" y="59" fill="#2f6f5c">러너 디스크·Unity 로그인 등 → 사람이 환경 수정</text>
  </g>
  <g stroke="#2f8f74" stroke-width="1.6" fill="none">
    <path d="M108 70V106" marker-end="url(#g)"/>
    <path d="M726 106V74" marker-end="url(#g)"/>
  </g>

  <!-- 단계 묶음 -->
  <g fill="#f7f5ff" stroke="#c9c2ee" stroke-width="1.2">
    <rect x="20" y="110" width="176" height="172" rx="12"/>
    <rect x="226" y="110" width="176" height="172" rx="12"/>
    <rect x="432" y="110" width="176" height="172" rx="12"/>
    <rect x="638" y="110" width="176" height="172" rx="12"/>
    <rect x="844" y="110" width="176" height="172" rx="12"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1a1440">
    <text x="34" y="136">1  이슈 읽기</text>
    <text x="240" y="136">2  계획</text>
    <text x="446" y="136">3  구현·검증</text>
    <text x="652" y="136">4  PR·CI</text>
    <text x="858" y="136">5  수락·머지</text>
  </g>

  <!-- 칩: 에이전트(보라), 스크립트(흰색), 사람 확인(초록), 외부 실행(옅은 보라) -->
  <g stroke-width="1.3">
    <rect x="30" y="150" width="156" height="34" rx="7" fill="#ffffff" stroke="#b9b1e6"/>
    <rect x="30" y="192" width="156" height="34" rx="7" fill="#ffffff" stroke="#b9b1e6"/>
    <rect x="30" y="234" width="156" height="34" rx="7" fill="#ffffff" stroke="#b9b1e6"/>

    <rect x="236" y="150" width="156" height="34" rx="7" fill="#e7e3fb" stroke="#5040c8"/>
    <rect x="236" y="192" width="156" height="34" rx="7" fill="#e7e3fb" stroke="#5040c8"/>
    <rect x="236" y="234" width="156" height="34" rx="7" fill="#ffffff" stroke="#b9b1e6"/>

    <rect x="442" y="150" width="156" height="34" rx="7" fill="#e7e3fb" stroke="#5040c8"/>
    <rect x="442" y="192" width="156" height="34" rx="7" fill="#ffffff" stroke="#b9b1e6"/>
    <rect x="442" y="234" width="156" height="34" rx="7" fill="#e7e3fb" stroke="#5040c8"/>

    <rect x="648" y="150" width="156" height="34" rx="7" fill="#e6f6f0" stroke="#2f8f74"/>
    <rect x="648" y="192" width="156" height="34" rx="7" fill="#f0eef9" stroke="#9a92c8" stroke-dasharray="3 3"/>
    <rect x="648" y="234" width="156" height="34" rx="7" fill="#ffffff" stroke="#b9b1e6"/>

    <rect x="854" y="150" width="156" height="34" rx="7" fill="#e6f6f0" stroke="#2f8f74"/>
    <rect x="854" y="192" width="156" height="34" rx="7" fill="#e6f6f0" stroke="#2f8f74"/>
    <rect x="854" y="234" width="156" height="34" rx="7" fill="#e6f6f0" stroke="#2f8f74"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2e2660">
    <text x="108" y="172">fetch · 이슈 가져오기</text>
    <text x="108" y="214">extract · 수락 기준</text>
    <text x="108" y="256">preflight · 환경 점검</text>

    <text x="314" y="172" fill="#3a2f9a" font-weight="600">discoverer · 코드 탐색</text>
    <text x="314" y="214" fill="#3a2f9a" font-weight="600">planner · 계획</text>
    <text x="314" y="256">scope_check · 범위</text>

    <text x="520" y="172" fill="#3a2f9a" font-weight="600">implementer / solo</text>
    <text x="520" y="214">verify · 범위·테스트</text>
    <text x="520" y="256" fill="#3a2f9a" font-weight="600">evaluator · 기준별 판정</text>

    <text x="726" y="172" fill="#17533f" font-weight="600">PR 생성 (확인)</text>
    <text x="726" y="214">GameCI EditMode 테스트</text>
    <text x="726" y="256">checks · 코드/인프라 분류</text>

    <text x="932" y="172" fill="#17533f" font-weight="600">수락 게이트</text>
    <text x="932" y="214" fill="#17533f" font-weight="600">merge (확인)</text>
    <text x="932" y="256" fill="#17533f" font-weight="600">Jira 완료 (확인)</text>
  </g>

  <!-- 단계 사이 정방향 흐름 -->
  <g stroke="#5040c8" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M196 196H222"/>
    <path d="M402 196H428"/>
    <path d="M608 196H634"/>
    <path d="M814 196H840"/>
  </g>

  <!-- 되돌림: 코드 실패·평가 실패·수락 거절 → 구현 -->
  <g stroke="#b0563f" stroke-width="1.6" fill="none">
    <path d="M726 282V312H520V286" marker-end="url(#r)"/>
    <path d="M900 282V312H726"/>
  </g>
  <text x="623" y="334" font-size="13" text-anchor="middle" fill="#8a3f2c">CI 코드 실패 · 평가 실패 · 수락 거절 → 구현으로 되돌림</text>
  <text x="623" y="352" font-size="12" text-anchor="middle" fill="#8a3f2c">실패 파일 위치와 확인한 사실만 전달 · 재시도 상한 있음</text>

  <!-- 미구현: 배포 -->
  <path d="M975 282V306" stroke="#9a92c8" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#a)"/>
  <rect x="930" y="310" width="90" height="46" rx="8" fill="none" stroke="#9a92c8" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="975" y="330" font-size="12" text-anchor="middle" fill="#6b619a">배포</text>
  <text x="975" y="347" font-size="11" text-anchor="middle" fill="#6b619a">미구현</text>

  <!-- 아래: 판정 주체와 하네스 -->
  <g stroke-width="1.2">
    <rect x="20" y="384" width="400" height="166" rx="12" fill="#ffffff" stroke="#c9c2ee"/>
    <rect x="440" y="384" width="580" height="166" rx="12" fill="#ffffff" stroke="#c9c2ee"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1a1440">
    <text x="40" y="414">state.py · 순서와 판정</text>
    <text x="460" y="414">하네스 · 모든 단계에 적용</text>
  </g>
  <g font-size="13" fill="#2e2660">
    <text x="40" y="444">단계 순서와 재시도 횟수를 기록하고 이어 가기</text>
    <text x="40" y="470">판정은 스크립트 종료 코드로만</text>
    <text x="56" y="494" fill="#6b619a">0 통과 · 1 재시도 · 3 차단(사람이 보완)</text>
    <text x="40" y="520">메인 세션은 판정하지 않고 결과만 옮김</text>

    <text x="460" y="444">guard-edit · 서브에이전트는 ownership.json 범위만 쓰기</text>
    <text x="460" y="470">guard-shell · push·외부 쓰기는 사람 확인, 서브에이전트는 읽기만</text>
    <text x="460" y="496">guard-read · guard-mcp · guard-skill · 비밀·쓰기 도구·스킬 풀 제한</text>
    <text x="460" y="522">Jira·GitHub 쓰기는 scripts/만 수행 · 에이전트에 쓰기 도구 없음</text>
  </g>

  <!-- 범례 -->
  <g font-size="12" fill="#6b619a">
    <rect x="20" y="568" width="16" height="14" rx="3" fill="#e7e3fb" stroke="#5040c8"/>
    <text x="42" y="580">서브에이전트</text>
    <rect x="130" y="568" width="16" height="14" rx="3" fill="#ffffff" stroke="#b9b1e6"/>
    <text x="152" y="580">결정적 스크립트</text>
    <rect x="256" y="568" width="16" height="14" rx="3" fill="#e6f6f0" stroke="#2f8f74"/>
    <text x="278" y="580">사람 결정·확인</text>
    <rect x="378" y="568" width="16" height="14" rx="3" fill="#f0eef9" stroke="#9a92c8" stroke-dasharray="3 3"/>
    <text x="400" y="580">GitHub Actions에서 실행</text>
    <rect x="550" y="568" width="16" height="14" rx="3" fill="none" stroke="#9a92c8" stroke-dasharray="3 3"/>
    <text x="572" y="580">미구현</text>
  </g>
</svg>
