<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Seongwon Choi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<!-- 아이콘: 사용 중인 Tabler 아이콘만 담은 로컬 서브셋 (재생성: bash .claude/scripts/build-icons.sh) -->
<link rel="stylesheet" href="assets/vendor/tabler-icons/tabler-icons-subset.css?v=ae979ebe">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* N++: 무채색 2톤(레벨 배경 + 솔리드 타일) + 금(골드) 하나만 포인트.
     기존 변수 이름은 유지하고 값만 바꾼다: --gold는 '강조 잉크'(검정), 채움 포인트는 --coin. */
  --navy:       #b9b9b6;   /* 레벨 배경 */
  --navy-2:     #c9c9c6;   /* 밝은 타일(패널) */
  --navy-3:     #d5d5d2;   /* 칩·안쪽 면 */
  --navy-4:     #8e8e8b;
  /* 텍스트: 닌자 블랙 */
  --cream:      #141414;
  --cream-1:    #1d1d1d;
  --cream-2:    #262626;
  --cream-3:    #43433f;
  --gold:       #141414;
  --gold-light: #000000;
  --white:      #000000;
  --coin:       #f2c230;   /* 금 */
  --coin-dark:  #8a6508;
  --mine:       #c8321f;   /* 지뢰 */
  --tile:       #3a3a38;   /* 솔리드 타일 */
  --tile-2:     #4b4b48;
  /* 네비·푸터 */
  --nav-bg:     #262625;
  --nav-ink:    #e9e9e6;
  --nav-ink-2:  #a3a3a0;
  --nav-accent: #f2c230;
  /* 규칙선 */
  --rule:       rgba(0,0,0,0.12);
  --rule-mid:   rgba(0,0,0,0.24);
  --sans:       'Outfit', 'Noto Sans KR', sans-serif;
  --mono:       'JetBrains Mono', ui-monospace, Consolas, monospace;
  --nav-h:      72px;
  --max-w:      1080px;
  --pad:        clamp(1rem, 3.5vw, 2rem);
  --radius:     0px;
  --cell:       24px;      /* 타일 한 칸 */
  --cut:        12px;      /* 45° 경사 모서리 (요소별로 덮어쓴다) */
  --grid:       rgba(0,0,0,.045);
}
html { scroll-behavior: smooth; }
body { word-break: keep-all; font-family: var(--sans); background: var(--navy); color: var(--cream); line-height: 1.7; -webkit-font-smoothing: antialiased; }

/* ── NAV ── */
#nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--nav-bg);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  transition: box-shadow .3s;
}
#nav.scrolled { box-shadow: 0 4px 20px rgba(0,0,0,.3); }
.nav-inner {
  height: 60px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--pad);
}

/* 푸터 파도 */
.footer-wave {
  width: 100%; height: 60px;
  position: relative; overflow: hidden;
  background: var(--navy);
  pointer-events: none;
  margin-top: 6rem;
}
.footer-wave svg {
  position: absolute; bottom: 0; left: 0;
  will-change: transform;
}
.fwsvg1 { width: 2880px; }
.fwsvg2 { width: 2880px; opacity: .75; }
.fwsvg3 { width: 2880px; opacity: .5; }

.nav-logo { font-size: 1rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--nav-ink); text-decoration: none; }
.nav-logo span { color: var(--nav-accent); }
@media(max-width:680px) {
  .nav-inner { height: auto; min-height: 72px; flex-direction: column; align-items: flex-start; justify-content: center; gap: .3rem; padding: .6rem var(--pad); }
  .nav-logo { font-size: .9rem; }
}

/* ── 메인 페이지 우측 목차: 현재 섹션을 레일 위 점으로 표시 ── */
.home-toc { position: fixed; top: 50%; right: clamp(1rem, 2.6vw, 2.5rem); transform: translateY(-50%); z-index: 30; display: flex; flex-direction: column; gap: .15rem; }
.home-toc::before { content: ''; position: absolute; left: 4px; top: .95rem; bottom: .95rem; width: 1px; background: var(--rule-mid); }
.home-toc a { position: relative; display: flex; align-items: center; gap: .65rem; padding: .4rem 0; font-size: .66rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--cream-3); text-decoration: none; transition: color .2s; }
.home-toc a::before { content: ''; flex-shrink: 0; width: 9px; height: 9px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid currentColor; background: var(--navy); transition: background .2s, transform .2s; }
.home-toc a:hover, .home-toc a:focus-visible, .home-toc a.active { color: var(--gold); outline: none; }
.home-toc a.active::before { background: var(--gold); transform: scale(1.2); }
@media(max-width:1359px){
  .home-toc span { position: absolute; right: calc(100% + .6rem); padding: .25rem .5rem; border-radius: 4px; background: var(--nav-bg); color: var(--nav-ink); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .home-toc a:hover span, .home-toc a:focus-visible span { opacity: 1; }
}
@media(max-width:1099px){ .home-toc { display: none; } }

main { max-width: var(--max-w); margin: 0 auto; padding: calc(var(--nav-h) + 2.5rem) var(--pad) 0; }

.eyebrow { display: inline-flex; align-items: center; gap: .6rem; font-size: .88rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: 2.5rem; }
.eyebrow-hint { font-size: .80rem; font-weight: 400; letter-spacing: .06em; text-transform: none; color: var(--cream-3); opacity: .7; }
.eyebrow::before { content: ''; display: block; width: 28px; height: 2px; background: var(--gold); }
.rule { border: none; border-top: 1px solid var(--rule); margin: 5rem 0; }
.hidden-section-rule { display: none; }
[hidden] { display: none !important; }

#about { width: 100%; }
#about-grid {
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr) minmax(300px, 380px);
  gap: 3rem;
  align-items: start;
}
#about-grid:not(:has(.about-glance:not([hidden]))) { grid-template-columns: 180px 1fr; max-width: 720px; gap: 4rem; }
@media(max-width:1000px){ #about-grid { grid-template-columns: 180px minmax(0, 1fr); } .about-glance { grid-column: 1 / -1; } }
@media(max-width:640px){
  /* 모바일: 사진을 줄여 이름 옆에 두고, 패널을 압축해 첫 화면 안에 한눈에 보기가 들어오게 한다 */
  #about-grid { grid-template-columns: 84px minmax(0, 1fr); gap: 1.5rem 1.1rem; }
  #about-grid .about-photo { width: 84px; height: 84px; border-width: 2px; box-shadow: 0 0 0 4px var(--navy-2), 0 0 0 5px rgba(0,0,0,0.2); }
  #about-grid .about-tag { margin-bottom: .7rem; }
  #about-grid .about-name-en { margin-bottom: 1rem; }
  #about-grid .about-divider { margin-bottom: 1rem; }
  #about-grid .about-meta { line-height: 1.8; }
}

.about-photo { width: 180px; height: 180px; border-radius: 50%; background: var(--navy-3); border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; color: var(--cream-3); font-size: .72rem; letter-spacing: .08em; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 6px var(--navy-2), 0 0 0 7px rgba(0,0,0,0.2); }
.about-photo img { width: 100%; height: 100%; object-fit: cover; }
.about-tag { display: inline-block; font-size: .68rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--gold); padding: .25rem .75rem; margin-bottom: 1.25rem; }
.about-name { font-size: clamp(2.4rem, 5.5vw, 3.8rem); font-weight: 700; line-height: 1.05; letter-spacing: -.01em; color: var(--nav-bg); margin-bottom: .4rem; }
.about-name-en { font-size: .85rem; font-weight: 400; letter-spacing: .12em; color: var(--cream-3); margin-bottom: 2rem; }
.about-divider { width: 40px; height: 2px; background: var(--gold); margin-bottom: 1.5rem; }
.about-meta { font-size: .9rem; color: var(--cream-2); line-height: 2.2; }
.about-meta a { color: var(--cream-2); text-decoration: none; border-bottom: 1px solid var(--rule-mid); transition: color .2s; }
.about-meta a:hover { color: var(--gold-light); }

/* ── 히어로 한눈에 보기 패널: 성과 수치, 수상·자격증, 대표 프로젝트 (모두 기존 데이터에서 생성) ── */
.about-glance { border: 1px solid var(--rule-mid); background: var(--navy-2); border-radius: 8px; padding: 1.25rem 1.25rem 1rem; display: flex; flex-direction: column; gap: 1.1rem; box-shadow: 0 12px 32px rgba(0,0,0,.06); }
.glance-label { font-size: .64rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: .55rem; }
.glance-stats { display: flex; gap: .6rem; flex-wrap: wrap; }
.glance-stat { flex: 1 1 0; min-width: 120px; display: flex; align-items: baseline; gap: .5rem; flex-direction: row-reverse; justify-content: flex-end; background: var(--navy); border: 1px solid var(--rule); border-radius: 6px; padding: .5rem .8rem; }
.glance-stat-v { display: block; font-size: 1.35rem; font-weight: 700; line-height: 1.15; color: var(--gold); }
.glance-stat-k { display: block; font-size: .8rem; color: var(--cream-2); }
.glance-list { list-style: none; display: flex; flex-direction: column; gap: .45rem; }
.glance-honor { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: .65rem; align-items: center; }
.glance-honor-icon { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--navy); font-size: 15px; }
.glance-honor.cert .glance-honor-icon { background: var(--navy-3); color: var(--gold); }
.glance-honor.award + .glance-honor.cert { border-top: 1px solid var(--rule-mid); padding-top: .55rem; margin-top: .15rem; }
.glance-honor-t { display: block; font-size: .9rem; font-weight: 600; color: var(--cream); line-height: 1.35; }
.glance-honor-s { display: block; font-size: .74rem; color: var(--cream-3); line-height: 1.35; }
@media(max-width:640px){
  .about-glance { padding: 1rem .9rem .75rem; gap: .9rem; }
  .glance-stat { min-width: 0; padding: .45rem .7rem; }
  .glance-list { gap: .3rem; }
}
.link-icons { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 2rem; }
.link-icon { display: inline-flex; align-items: center; gap: .5rem; padding: .5rem 1.1rem; border: 1px solid var(--rule-mid); font-size: .73rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--cream-2); text-decoration: none; background: var(--navy-3); transition: background .2s, color .2s, border-color .2s; }
.link-icon:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.link-icon svg { width: 14px; height: 14px; fill: currentColor; }

.skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; align-items: end; }
.cup { position: relative; border-radius: 4px 4px 12px 12px; overflow: hidden; transition: transform .22s cubic-bezier(.34,1.56,.64,1); cursor: default; }
.cup:hover { transform: translateY(-6px); }
.other-works-grid { display: flex; flex-direction: column; gap: 1.25rem; }
.ow-row { display: flex; gap: 1.25rem; align-items: baseline; flex-wrap: wrap; }
.ow-cat { font-size: .68rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); flex-shrink: 0; width: 140px; padding-top: .15rem; }
.ow-tags { display: flex; gap: .5rem; flex-wrap: wrap; }
.ow-tag { font-size: .8rem; font-weight: 400; color: var(--cream-2); padding: .25rem .7rem; border: 1px solid var(--rule-mid); border-radius: 999px; background: var(--navy-2); transition: border-color .2s, color .2s; }
.ow-tag:hover { border-color: var(--gold); color: var(--gold-light); }
.cup-water { position: absolute; bottom: 0; left: 0; right: 0; z-index: 1; }
.wave-wrap { position: absolute; top: -20px; left: 0; width: 200%; height: 22px; pointer-events: none; }
.wave-svg { display: block; width: 100%; height: 22px; }
@keyframes cupWave { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
.cwl1 { animation: cupWave 5.5s linear infinite; }
.cwl2 { animation: cupWave 8s linear infinite reverse; }
.cup:hover .cwl1 { animation-duration: 3.5s; }
.cup:hover .cwl2 { animation-duration: 5s; }
.cup-items { position: absolute; bottom: 0; left: 0; right: 0; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 11px 10px; }
.cup-item { display: flex; align-items: center; gap: 7px; font-size: .82rem; font-weight: 500; padding: 6px 6px; border-radius: 4px; }
.cup-icon { width: 20px; flex-shrink: 0; font-size: 18px; line-height: 1; text-align: center; opacity: .9; }
.cup-cat { position: absolute; top: 13px; left: 13px; right: 13px; font-size: .6rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; display: flex; align-items: center; gap: 5px; z-index: 3; }
.cup-cat-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }



/* ── Activities: 좌측 활동 타임라인(무채색 레일, 연도 구분) + 우측 수상·자격증 목록 ── */
.ag { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 3rem; align-items: start; }
.ag:not(:has(.ag-side)) { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
.ag-label { font-size: .68rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--cream-3); margin-bottom: 1rem; }
.ag-year { display: flex; align-items: center; gap: .8rem; margin: 1.5rem 0 .55rem; font-size: .82rem; font-weight: 700; color: var(--cream); font-variant-numeric: tabular-nums; }
.ag-year:first-of-type { margin-top: 0; }
.ag-year::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
.ag-list { list-style: none; margin-left: 15px; border-left: 2px solid var(--rule); }
.ag-item { position: relative; padding: .4rem 0 .55rem 1.6rem; min-height: 46px; }
.ag-badge { position: absolute; left: -16px; top: .35rem; width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; display: grid; place-items: center; background: var(--navy); border: 1px solid var(--rule-mid); color: var(--cream-3); font-size: 15px; }
.ag-title { font-size: .93rem; font-weight: 600; line-height: 1.45; color: var(--cream); }
.ag-meta { margin-top: .1rem; font-size: .78rem; line-height: 1.5; color: var(--cream-3); }
.ag-side { position: sticky; top: calc(var(--nav-h) + 1.5rem); display: flex; flex-direction: column; gap: 1.1rem; padding: 1.15rem 1.2rem; border: 1px solid var(--rule-mid); background: var(--navy-2); border-radius: var(--radius); }
.ag-side .ag-label { margin-bottom: .6rem; }
.ag-side > div + div { padding-top: 1.1rem; border-top: 1px solid var(--rule); }
@media(max-width:900px){
  .ag { grid-template-columns: minmax(0, 1fr); gap: 2.25rem; }
  .ag-side { position: static; order: -1; }
}

.projects-list { display: flex; flex-direction: column; }
.projects-group-label { font-size: .68rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin: 0 0 .8rem; }
.projects-main { display: flex; flex-direction: column; }
.projects-sub { position: relative; margin-top: 3rem; padding: 2.6rem 0 .4rem; overflow: hidden; border-top: 1px solid var(--rule); }
.projects-sub-head { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: .7rem; }
.projects-sub .projects-group-label { display: inline-flex; align-items: center; gap: .6rem; font-size: .88rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: .2rem; }
.projects-sub .projects-group-label::before { content: ''; display: block; width: 28px; height: 2px; background: var(--gold); }
.sub-project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; }
.sub-project-card { position: relative; min-width: 0; display: flex; flex-direction: column; gap: .9rem; padding: 1rem; border: 1px solid var(--rule); background: var(--navy-2); border-radius: var(--radius); transition: border-color .2s, box-shadow .2s; }
.sub-project-card:hover, .sub-project-card:focus-within { border-color: var(--rule-mid); box-shadow: 0 10px 30px rgba(0,0,0,.06); }
.sub-project-card .proj-media { width: 100%; min-width: 0; }
.sub-project-card .proj-slider { aspect-ratio: 2/1; }
.sub-project-card .slide-type-badge { display: none; }
.sub-project-card .proj-info { flex: 1; gap: .55rem; min-width: 0; }
.sub-project-card .slider-nav { margin-top: .35rem; }
.sub-project-heading { display: flex; align-items: center; justify-content: space-between; gap: .65rem; flex-wrap: wrap; }
.sub-project-footer { display: flex; align-items: flex-end; gap: 1rem; margin-top: auto; }
.sub-project-footer .proj-summary { flex: 1; min-width: 0; margin: 0; }
.sub-project-card .proj-index { font-size: .8rem; }
.sub-project-card .proj-badges { gap: .4rem; margin: 0; flex-wrap: wrap; }
.sub-project-card .proj-badge { font-size: .75rem; padding: .25rem .55rem; }
.sub-project-card .proj-title { font-size: 1.45rem; line-height: 1.3; overflow-wrap: anywhere; }
.sub-project-card .proj-meta-line { font-size: .88rem; }
.sub-project-card .proj-summary { font-size: .92rem; line-height: 1.65; margin-bottom: .4rem; }
.sub-project-card .proj-show-more { position: static; align-self: flex-end; flex-shrink: 0; margin-top: 0; font-size: .72rem; padding: .65rem 1rem; }
.sub-project-card .proj-show-more:hover { background: var(--gold); color: var(--navy); }
.milestone-summary { display: flex; align-items: baseline; gap: .65rem; padding: 0 0 1.2rem; margin-bottom: 1.2rem; border-bottom: 1px solid var(--rule); }
.milestone-summary strong { font-size: 1.35rem; color: var(--gold); line-height: 1; }
.milestone-summary span { font-size: .92rem; color: var(--cream-2); }
.milestone-validity { font-size: .78rem; color: var(--cream-3); margin-top: .35rem; line-height: 1.6; }
.milestone-source { color: inherit; text-decoration: none; }
.milestone-source:hover { color: var(--gold); }
.optimization-comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; padding: 1rem; border-top: 1px solid var(--rule); }
.optimization-comparison.stacked { grid-template-columns: minmax(0, 1fr); }
.optimization-comparison figure { min-width: 0; margin: 0; }
.optimization-comparison a { display: block; cursor: zoom-in; }
.optimization-comparison a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.optimization-comparison img { display: block; width: 100%; aspect-ratio: 16/10; object-fit: contain; background: var(--navy-3); border: 1px solid var(--rule); border-radius: var(--radius); }
.optimization-comparison .optimization-crop { overflow: hidden; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--navy-3); }
.optimization-comparison .optimization-crop img { height: auto; aspect-ratio: auto; border: 0; border-radius: 0; }
.optimization-comparison figcaption { margin-top: .55rem; font-size: .82rem; line-height: 1.6; color: var(--cream-2); }
.optimization-comparison figcaption strong { display: block; color: var(--cream); margin-bottom: .15rem; }
@media(max-width:680px) { .sub-project-grid, .optimization-comparison { grid-template-columns: 1fr; } }
/* 여백은 카드끼리 구분될 만큼만 둔다 (5.75rem → 3rem): 메인 4개를 적은 스크롤로 비교할 수 있게 */
.project-card { display: grid; grid-template-columns: 58% 1fr; gap: 3.5rem; align-items: center; padding: 3rem 0; border-bottom: 1px solid var(--rule); }
.project-card:first-child { border-top: 1px solid var(--rule); }
.project-card.reverse { direction: rtl; }
.project-card.reverse > * { direction: ltr; }
@media(max-width:680px){
  .project-card, .project-card.reverse { grid-template-columns: 1fr; direction: ltr; gap: 1.25rem; padding: 2.25rem 0; }
  .projects-sub-head { align-items: start; flex-direction: column; }
  .sub-project-card .proj-title { font-size: 1.25rem; }

}

.proj-media { position: relative; }
.proj-slider { width: 100%; aspect-ratio: 16/9; background: var(--navy-3); border: 1px solid var(--rule-mid); overflow: hidden; position: relative; transition: border-color .3s; }
.proj-slider:hover { border-color: var(--gold); }
.proj-slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .4s ease; }
.proj-slide.active { opacity: 1; pointer-events: auto;}
.proj-slide img, .proj-slide iframe, .proj-slide video { width: 100%; height: 100%; object-fit: cover; }
.proj-slide video {
  display: block;
}

/* 본문 섹션들 */

.retro-card.good .retro-card-label { color: #4a9e6a; }
.retro-card.bad  .retro-card-label { color: var(--gold); }
.retro-card-text { font-size: .855rem; color: var(--cream-2); line-height: 1.8; }
.feedback-chart { display: flex; flex-direction: column; gap: .8rem; padding: 1rem; border: 1px solid var(--rule-mid); background: var(--navy-2); border-radius: var(--radius); box-shadow: none; }
.feedback-row { display: flex; align-items: center; gap: 1rem; }
.feedback-label-wrap { display: flex; flex-direction: column; gap: .1rem; width: 68px; flex-shrink: 0; }
.feedback-label { font-size: .8rem; color: var(--cream-2); }
.feedback-bar-wrap { flex: 1; max-width: 480px; height: 8px; background: var(--navy-3); border-radius: 4px; overflow: hidden; }
.feedback-bar { height: 100%; border-radius: 4px; background: linear-gradient(to right, #5040c8, #a0f0d8); transition: width .8s cubic-bezier(.22,1,.36,1); }
.feedback-val { font-size: .78rem; color: var(--cream-3); width: 44px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.feedback-source { font-size: .68rem; color: var(--cream-3); }
.troubleshooting-list, .optimization-list, .feedback-iteration-list { display: grid; gap: .7rem; }
.feedback-iteration-list { margin-top: .9rem; }
.flow-card { border: 1px solid var(--rule-mid); background: var(--navy-2); border-radius: var(--radius); overflow: hidden; box-shadow: none; }
.flow-card-title { display: flex; align-items: center; justify-content: space-between; gap: .65rem; padding: .65rem 1rem; border-bottom: 1px solid rgba(0,0,0,.09); color: var(--white); font-size: .95rem; font-weight: 700; background: var(--navy-3); }
.flow-card-title span { min-width: 0; }
.flow-row { display: grid; grid-template-columns: repeat(var(--flow-count, 4), 1fr); }
.flow-cell { position: relative; padding: 1rem 1rem .95rem; border-right: 1px solid rgba(0,0,0,.085); min-width: 0; background: var(--flow-bg, transparent); }
.flow-cell:last-child { border-right: none; }
.flow-cell:not(:last-child)::after {
  content: '→';
  position: absolute;
  top: 50%;
  right: -13px;
  z-index: 2;
  width: 26px;
  height: 26px;
  border: 1px solid var(--rule-mid);
  border-radius: 50%;
  background: inherit;
  color: var(--gold);
  display: grid;
  place-items: center;
  font-size: .8rem;
  font-weight: 700;
  transform: translateY(-50%);
}
.flow-step-0 { --flow-bg: rgba(0,0,0,.055); }
.flow-step-1 { --flow-bg: rgba(30,95,168,.055); }
.flow-step-2 { --flow-bg: rgba(14,112,112,.055); }
.flow-step-3 { --flow-bg: rgba(146,96,10,.055); }
.flow-step-0 .flow-label { color: #5040c8; }
.flow-step-1 .flow-label { color: #1e5fa8; }
.flow-step-2 .flow-label { color: #0e7070; }
.flow-step-3 .flow-label { color: #92600a; }
.flow-label { display: inline-flex; align-items: center; gap: .4rem; font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .45rem; }
.flow-label::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.flow-text { font-size: .82rem; color: var(--cream-2); line-height: 1.65; }
.feedback-flow-card { border: none; background: transparent; overflow: visible; }
.feedback-flow-card .flow-row { display: grid; grid-template-columns: minmax(0, 1fr) 42px minmax(0, 1fr); gap: .7rem; align-items: stretch; }
.feedback-flow-card .flow-cell { border: 1px solid var(--rule-mid); border-radius: var(--radius); background: var(--navy-2); }
.feedback-flow-card .flow-cell:first-child { grid-column: 1; }
.feedback-flow-card .flow-cell:first-child { display: flex; flex-direction: column; }
.feedback-quote-mark { position: absolute; top: .45rem; right: .65rem; font-size: 3rem; color: var(--gold); opacity: .08; pointer-events: none; }
.feedback-flow-card .flow-label, .feedback-flow-card .flow-text { position: relative; }
.feedback-citation { display: block; align-self: flex-end; margin-top: auto; padding-top: .55rem; font-size: .72rem; line-height: 1.5; color: var(--cream-3); text-align: right; text-decoration: none; }
a.feedback-citation:hover { color: var(--gold); }
.feedback-quote { position: relative; }
.feedback-quote-text { position: relative; }
.feedback-flow-card .flow-cell:last-child { grid-column: 3; }
.feedback-flow-card .flow-cell:first-child::after {
  content: '→';
  position: absolute;
  top: 50%;
  right: -49px;
  z-index: 2;
  width: 34px;
  height: 34px;
  border: 1px solid var(--rule-mid);
  border-radius: 50%;
  background: var(--navy-2);
  color: var(--gold);
  display: grid;
  place-items: center;
  font-size: 1rem;
  font-weight: 800;
  transform: translateY(-50%);
}
.feedback-flow-card .flow-cell:last-child::after { display: none; }
.iteration-card { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--rule); background: var(--navy-2); border-radius: var(--radius); overflow: hidden; }
.iteration-half { padding: .9rem 1rem; }
.iteration-half:first-child { border-right: 1px solid var(--rule); }
@media(max-width:760px){
  .flow-row, .iteration-card { grid-template-columns: 1fr; }
  .flow-cell, .iteration-half:first-child { border-right: none; border-bottom: 1px solid var(--rule); }
  .flow-cell:not(:last-child)::after { display: none; }
  .feedback-flow-card .flow-row { grid-template-columns: 1fr; gap: .55rem; }
  .feedback-flow-card .flow-cell:first-child,
  .feedback-flow-card .flow-cell:last-child { grid-column: auto; }
  .feedback-flow-card .flow-cell:first-child::after { display: none; }
}

/* 상세 목차: 메인 페이지와 같은 우측 레일(.home-toc)을 쓴다. 라벨이 길어서 이름 표시는 1600px 이상에서만 */
.detail-section { scroll-margin-top: calc(var(--nav-h) + 1.25rem); }
@media(min-width:1360px) and (max-width:1599px){
  .detail-rail span { position: absolute; right: calc(100% + .6rem); padding: .25rem .5rem; border-radius: 4px; background: var(--nav-bg); color: var(--nav-ink); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .detail-rail a:hover span, .detail-rail a:focus-visible span { opacity: 1; }
}

footer { background: var(--nav-bg); padding: 0; }
.footer-wave {
  width: 100%; height: 40px;
  position: relative; overflow: hidden; line-height: 0;
  background: var(--bg);
}
.footer-wave svg {
  position: absolute; bottom: 0; left: 0;
  height: 40px; will-change: transform;
}
.fwsvg1 { width: 2880px; }
.fwsvg2 { width: 2880px; opacity: .65; }
.fwsvg3 { width: 2880px; opacity: .38; }
.footer-inner { max-width: var(--max-w); margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem; padding: 2.5rem var(--pad); }
.footer-brand { font-size: 1rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--nav-ink); }
.footer-brand span { color: var(--nav-accent); }
.footer-links { display: flex; gap: 1.5rem; }
.footer-links a { font-size: .72rem; font-weight: 500; letter-spacing: .08em; color: var(--nav-ink-2); text-decoration: none; transition: color .2s; }
.footer-links a:hover { color: var(--nav-accent); }
.footer-copy { font-size: .72rem; color: var(--nav-ink-2); width: 100%; }

@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
.fade-up { animation: fadeUp .55s ease both; }
.fu1{animation-delay:.06s} .fu2{animation-delay:.13s} .fu3{animation-delay:.20s} .fu4{animation-delay:.27s} .fu5{animation-delay:.34s}

.detail-nav-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 5rem; padding-top: 2rem; border-top: 1px solid var(--rule); flex-wrap: wrap; }
.detail-nav-btn { display: inline-flex; align-items: center; gap: .5rem; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: .65rem 1.25rem; border: 1px solid var(--rule-mid); background: transparent; color: var(--cream-2); cursor: pointer; font-family: var(--sans); border-radius: var(--radius); transition: background .2s, color .2s, border-color .2s; }
.detail-nav-btn:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.detail-nav-btn:disabled { opacity: .3; cursor: default; pointer-events: none; }
.detail-nav-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.5; }
.detail-nav-center { display: flex; gap: .75rem; }
.shelf-row { display: flex; flex-direction: row; gap: 6px; align-items: flex-end; padding: 0 8px; flex-wrap: wrap; }
.shelf-floor { height: 6px; background: var(--rule-mid); border-radius: 2px; margin: 0 0 1rem; }
.shelf-legend { display: flex; gap: 1.25rem; flex-wrap: wrap; padding: 0 8px; }
.shelf-legend-item { display: flex; align-items: center; gap: 6px; font-size: .72rem; color: var(--cream-3); }
.shelf-legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

.book-wrap { position: relative; flex-shrink: 0; width: 38px; cursor: default; z-index: 1; }
.book-wrap:hover { z-index: 500; }
.book-inner {
  position: relative; width: 38px;
  transition: transform .4s cubic-bezier(.34,1.2,.64,1), box-shadow .4s;
}
.book-wrap:hover .book-inner {
  transform: translateY(-60px);
  box-shadow: 0 20px 40px rgba(0,0,0,.5);
}
.book-spine-el {
  width: 38px; border-radius: 3px;
  border-left: 3px solid rgba(255,255,255,.2);
  display: flex; flex-direction: column; padding: 10px 5px;
  position: relative; z-index: 1;
}
.book-spine { writing-mode: vertical-lr; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; font-family: var(--sans); }
.book-cover-panel {
  position: absolute; bottom: 0; left: 0;
  width: 0; height: 100%; border-radius: 3px;
  overflow: hidden; z-index: 3;
  transition: width .4s cubic-bezier(.34,1.1,.64,1);
}
.book-wrap:hover .book-cover-panel { width: calc(var(--book-h) * 3 / 4); }
.book-cover-img { height: 100%; width: auto; object-fit: cover; display: block; }
.book-cover-bg { height: 100%; width: 100%; }
.book-popup {
  position: absolute; top: 0; width: 180px;
  background: var(--navy-2); border: 1px solid var(--rule-mid);
  border-radius: var(--radius); padding: 12px;
  opacity: 0; pointer-events: none;
  transform: translateX(-4px);
  transition: opacity .2s ease, transform .2s ease;
  z-index: 400;
}
.book-wrap:hover .book-popup { opacity: 1; pointer-events: auto; transform: translateX(0); transition-delay: .28s; }
.book-popup-genre { font-size: .6rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 5px; }
.book-popup-title { font-size: .82rem; font-weight: 500; color: var(--cream); line-height: 1.35; margin-bottom: 2px; }
.book-popup-author { font-size: .75rem; color: var(--cream-3); margin-bottom: 6px; }
.book-popup-memo { font-size: .75rem; color: var(--cream-3); line-height: 1.5; border-top: 1px solid var(--rule); padding-top: 6px; }

/* ── 섹션 좌측 그라디언트 라이트 ── */
.section-highlight { position: relative; overflow: visible; }
.section-highlight::before { display: none; }

/* 라이트 오버레이 — fixed, JS로 위치 제어 */
#section-light {
  position: fixed;
  left: 0; top: 0;
  width: 40vw;
  pointer-events: none;
  z-index: 1;
  background: linear-gradient(to right, rgba(0,0,0,.055) 0%, rgba(0,0,0,.02) 50%, transparent 100%);
  opacity: 0;
  transition: opacity .5s ease;
}
#section-light.visible { opacity: 1; }

/* ── 프로젝트 카드 light ──
   포커스 카드만 은은한 배경 빛으로 표시한다. 나머지 카드를 흐리게(opacity)·작게(scale) 하지 않는다:
   화면에 걸린 카드를 모두 읽을 수 있어야 훑어보기 쉽다. */
.project-card {
  position: relative; overflow: visible;
}
.project-card::after {
  content: '';
  position: absolute;
  left: calc(-1 * var(--pad)); right: 0; top: 0; bottom: 0;
  background: linear-gradient(to right, rgba(0,0,0,.09) 0%, rgba(0,0,0,.03) 45%, transparent 80%);
  opacity: 0;
  transition: opacity .5s ease;
  pointer-events: none;
}
.project-card.in-view::after { opacity: 1; }

/* ══════════════════════════════════════════════════════════════════
   N++ 테마
   - 평면: 그림자·그라디언트·둥근 모서리 없음. 무채색 2톤 + 금 하나
   - 타일: 24px 격자 배경, 45° 경사로 깎은 모서리(clip-path, --cut)
   - 메뉴 타이포: 소문자 라벨, 고정폭 숫자(레벨 코드·시간)
   - 게임 요소: 금 = 활성/완료, 지뢰(빨강 원) = 아쉬운 점, 출구 문 = 페이지 끝
   ══════════════════════════════════════════════════════════════════ */
*, *::before, *::after { border-radius: 0 !important; box-shadow: none !important; text-shadow: none !important; }
body {
  background-color: var(--navy);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: var(--cell) var(--cell);
}
::selection { background: var(--coin); color: #000; }
:focus-visible { outline: 2px solid #000; outline-offset: 2px; }
#section-light { display: none; }

/* 45° 경사 모서리: 왼쪽 위 + 오른쪽 아래를 깎는다 */
.about-photo, .about-glance, .link-icon, .cup, .ag-side, .sub-project-card, .proj-show-more,
.detail-overview-layout, .contribution-summary, .flow-card, .detail-nav-btn, .about-tag, .retro-card {
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
}

/* 메뉴식 소문자 라벨 */
.eyebrow, .home-toc a, .footer-links a, .glance-label, .ag-label, .projects-group-label, .detail-section-label,
.detail-overview-kicker, .detail-overview-label, .contribution-group-head, .retro-card-label, .flow-label,
.proj-show-more, .detail-back, .detail-nav-btn, .link-icon, .about-tag, .cup-cat, .proj-index, .detail-eyebrow,
.slide-type-badge, .proj-meta-item strong, .detail-info-key, .ow-cat {
  text-transform: lowercase; letter-spacing: .02em;
}
.proj-badge, .proj-tag, .detail-overview-link, .contribution-badge { text-transform: none; letter-spacing: .02em; }

/* ── 네비 + 타임바 ── */
#nav { background: var(--navy-2); border-bottom: none; }
.nav-inner { height: 56px; }
.nav-logo { display: inline-flex; align-items: center; gap: 0; color: var(--cream); font-size: 1.2rem; font-weight: 800; letter-spacing: 0; text-transform: none; }
.nav-logo span { color: var(--coin-dark); }
.nav-logo .nav-logo-mark { position: relative; margin-right: .6rem; width: 22px; height: 22px; background: var(--tile); clip-path: polygon(0 0, 100% 0, 100% 100%, 30% 100%, 0 70%); }
.nav-logo .nav-logo-mark::after { content: ''; position: absolute; left: 7px; top: 7px; width: 8px; height: 8px; background: var(--coin); }
.nav-hud { display: flex; align-items: baseline; gap: .55rem; font-family: var(--mono); font-size: .75rem; color: var(--cream-3); }
.nav-hud-v { min-width: 7ch; font-weight: 700; color: var(--cream); font-variant-numeric: tabular-nums; }
.timebar { position: relative; height: 6px; background: var(--tile); }
.timebar-fill { position: absolute; inset: 0; background: var(--coin); transform-origin: left center; transform: scaleX(0); }
.ninja { position: absolute; left: 8px; bottom: 100%; width: 16px; height: 22px; overflow: visible; fill: #000; stroke: #000; stroke-width: 2.3; stroke-linecap: round; pointer-events: none; }
.ninja-sash { fill: none; stroke-width: 1.4; }
.ninja-body { transform-origin: 10px 14px; }
.ninja.back .ninja-body { transform: scaleX(-1); }
.ninja-leg { transform-origin: 10px 17px; }
.ninja-arm { transform-origin: 10px 10px; }
.ninja .l1 { transform: rotate(12deg); }  .ninja .l2 { transform: rotate(-12deg); }
.ninja .a1 { transform: rotate(18deg); }  .ninja .a2 { transform: rotate(-18deg); }
@keyframes ninjaSwing { from { transform: rotate(38deg); } to { transform: rotate(-38deg); } }
.ninja.running .ninja-body { animation: none; }
.ninja.running .l1, .ninja.running .a2 { animation: ninjaSwing .22s ease-in-out infinite alternate; }
.ninja.running .l2, .ninja.running .a1 { animation: ninjaSwing .22s ease-in-out infinite alternate-reverse; }
@media(max-width:680px){
  .nav-inner { height: 52px; min-height: 0; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 var(--pad); }
  .nav-logo { font-size: 1.05rem; }
}
@media (prefers-reduced-motion: reduce){
  .ninja .ninja-leg, .ninja .ninja-arm { animation: none !important; }
  .cup:hover, .contribution-summary:hover { transform: none; }
}

/* ── 우측 목차: 레벨 선택 칸 ── */
.home-toc::before { left: 4px; width: 2px; background: rgba(0,0,0,.2); }
.home-toc a { font-size: .78rem; color: var(--cream-3); }
.home-toc a::before { width: 10px; height: 10px; border: 2px solid var(--tile); background: var(--navy); }
.home-toc a:hover, .home-toc a:focus-visible, .home-toc a.active { color: #000; }
.home-toc a.active::before { background: var(--coin); border-color: var(--coin-dark); transform: none; }

/* ── 섹션 제목: 금 + 레벨 코드 ── */
#list-view { counter-reset: lv; }
.eyebrow { counter-increment: lv; gap: .7rem; font-size: 1.6rem; font-weight: 800; color: #000; margin-bottom: 2rem; }
.eyebrow::before { width: 16px; height: 16px; background: var(--coin); border: 3px solid var(--coin-dark); }
.eyebrow::after { content: counter(lv, decimal-leading-zero); order: -1; padding: .15rem .45rem; font-family: var(--mono); font-size: .72rem; font-weight: 600; color: var(--nav-ink); background: var(--tile); }
.eyebrow-hint { font-size: .8rem; }
.rule { border-top: 2px solid rgba(0,0,0,.16); margin: 4.5rem 0; }
@media(max-width:640px){ .eyebrow { font-size: 1.3rem; } }

/* ── About ── */
.about-photo { --cut: 24px; border: 6px solid var(--tile); background: var(--tile); filter: grayscale(1) contrast(1.05); transition: filter .3s; }
.about-photo:hover { filter: none; }
#about-grid .about-photo { box-shadow: none; }
@media(max-width:640px){ #about-grid .about-photo { --cut: 12px; border-width: 4px; } }
.about-tag { --cut: 6px; border: none; background: var(--tile); color: var(--nav-ink); font-family: var(--mono); font-size: .72rem; padding: .3rem .75rem; }
.about-name { color: #000; font-weight: 800; letter-spacing: -.02em; }
.about-name-en { font-family: var(--mono); font-size: .78rem; letter-spacing: .02em; }
.about-divider { width: 48px; height: 6px; background: var(--coin); }
.about-meta a { border-bottom: 2px solid var(--coin); }
.about-meta a:hover { color: #000; background: var(--coin); }
.link-icon { --cut: 8px; border: none; background: var(--tile); color: var(--nav-ink); font-size: .8rem; padding: .6rem 1.1rem; }
.link-icon:hover { background: var(--coin); color: #000; }
.about-glance { --cut: 18px; border: none; background: var(--navy-2); padding: 1.3rem 1.3rem 1.1rem; }
.glance-label { font-family: var(--mono); font-size: .72rem; font-weight: 600; color: var(--cream-3); }
.glance-stat { border: none; background: var(--navy-3); }
.glance-stat-v { font-family: var(--mono); color: #000; }
.glance-honor-icon { background: var(--coin); color: #000; }
.glance-honor.cert .glance-honor-icon { background: var(--tile); color: var(--nav-ink); }
.glance-honor.award + .glance-honor.cert { border-top: 2px solid rgba(0,0,0,.12); }

/* ── Skills: 에피소드 타일 ── */
.skills-grid { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: stretch; }
.cup { --cut: 14px; display: flex; flex-direction: column; gap: .75rem; padding: 1rem 1rem 1.1rem; overflow: visible; background: var(--tile); color: var(--nav-ink); transition: transform .15s ease; }
.cup:hover { transform: translateY(-4px); }
.cup-cat { position: static; display: flex; align-items: baseline; gap: .5rem; font-size: 1rem; font-weight: 700; color: #fff; }
.cup-code { font-family: var(--mono); font-size: .68rem; font-weight: 600; color: var(--coin); }
.cup-cells { display: flex; gap: 4px; }
.cup-cells i { display: block; width: 12px; height: 12px; background: var(--tile-2); }
.cup-cells i.on { background: var(--coin); border: 2px solid var(--coin-dark); }
.cup-items { position: static; list-style: none; padding: 0; display: flex; flex-direction: column; gap: .1rem; }
.cup-item { padding: .25rem 0; font-size: .88rem; color: var(--nav-ink); }
.cup-icon { color: var(--nav-ink-2); opacity: 1; transition: color .15s; }
.cup:hover .cup-icon { color: var(--coin); }

/* ── Activities ── */
.ag-label { font-family: var(--mono); font-size: .72rem; font-weight: 600; }
.ag-year { font-family: var(--mono); font-size: .85rem; }
.ag-year::after { height: 2px; background: rgba(0,0,0,.14); }
.ag-list { border-left: 2px solid rgba(0,0,0,.22); }
.ag-badge { width: 28px; height: 28px; left: -15px; background: var(--navy-2); border: 2px solid var(--tile); color: var(--cream); }
.ag-side { --cut: 16px; border: none; background: var(--navy-2); }
.ag-side > div + div { border-top: 2px solid rgba(0,0,0,.12); }

/* ── Projects ── */
.project-card, .project-card:first-child { border-color: rgba(0,0,0,.16); border-width: 2px; }
.project-card::after { right: auto; width: 6px; background: var(--coin); }
.proj-slider { border: 6px solid var(--tile); background: var(--tile); }
.proj-slider:hover { border-color: #000; }
.slide-type-badge { background: var(--coin); color: #000; font-family: var(--mono); }
.slider-dot { width: 8px; height: 8px; border: none; background: var(--navy-4); }
.slider-dot.active { width: 22px; background: var(--coin); outline: 2px solid var(--coin-dark); outline-offset: -2px; }
.slider-btn { color: var(--cream-2); }
.proj-index { align-self: flex-start; padding: .15rem .5rem; font-family: var(--mono); font-size: .72rem; background: var(--tile); color: var(--coin); }
.proj-title { color: #000; font-weight: 800; letter-spacing: -.02em; }
.proj-badge { border: 1.5px solid var(--tile); background: transparent; color: var(--cream); }
.proj-badge.primary { background: var(--tile); color: #fff; border-color: var(--tile); }
.proj-badge.sub { background: transparent; color: var(--cream); border-color: var(--tile); }
.proj-meta-row { border-width: 2px; }
.proj-show-more { --cut: 10px; border: none; background: var(--tile); color: var(--nav-ink); font-size: .85rem; }
.proj-show-more:hover, .sub-project-card .proj-show-more:hover { background: var(--coin); color: #000; }
.projects-sub { border-top: 2px solid rgba(0,0,0,.16); }
.projects-sub .projects-group-label { font-size: 1.15rem; font-weight: 800; letter-spacing: .02em; text-transform: lowercase; color: #000; }
.projects-sub .projects-group-label::before { width: 12px; height: 12px; background: var(--tile); }
.sub-project-card { --cut: 16px; border: none; background: var(--navy-2); }
.ow-tag { border: none; background: var(--navy-2); }
.ow-tag:hover { background: var(--coin); color: #000; }

/* ── 상세 페이지 ── */
.detail-back { font-family: var(--mono); font-size: .78rem; color: var(--cream-2); }
.detail-back:hover { color: #000; }
.detail-eyebrow { display: inline-block; padding: .2rem .55rem; font-family: var(--mono); font-size: .74rem; background: var(--tile); color: var(--coin); }
.detail-title { font-weight: 800; }
.detail-media { border: 6px solid var(--tile); background: var(--tile); }
.detail-media-nav .slider-btn { border: none; background: var(--tile); color: var(--nav-ink); }
.detail-media-nav .slider-btn:hover { background: var(--coin); color: #000; }
.detail-section, .detail-section:first-child { border-color: rgba(0,0,0,.16); border-width: 2px; }
.detail-section::before { width: 6px; background: var(--coin); }
.detail-section::after { display: none; }
.detail-section.in-view::before { opacity: 1; }
.detail-section-label { gap: .7rem; font-size: 1.35rem; letter-spacing: 0; color: #000; }
.detail-section-label::before { content: ''; flex-shrink: 0; width: 14px; height: 14px; background: var(--coin); border: 3px solid var(--coin-dark); }
.detail-section-label::after { height: 2px; background: rgba(0,0,0,.16); }
.detail-overview-layout { --cut: 18px; border: none; background: var(--navy-2); }
.detail-overview-kicker, .detail-overview-label { color: #000; }
.detail-overview-group + .detail-overview-group, .detail-overview-group + .detail-overview-hero, .detail-overview-hero + .detail-overview-group { border-top: 2px solid rgba(0,0,0,.12); }
.detail-overview-chips span { border: none; background: var(--navy-3); }
.detail-info-key { font-family: var(--mono); }
.detail-overview-link { border: none; background: var(--tile); color: var(--nav-ink); }
.detail-overview-link:hover { background: var(--coin); color: #000; }
.role-card { border: none; background: var(--navy-2); }
.role-card.role-primary { border: none; border-left: 6px solid var(--coin); background: var(--navy-2); }
.role-card.role-primary .role-card-icon { color: #000; }
.contribution-group-head::after, .contribution-group.core .contribution-group-head::after, .contribution-group.additional .contribution-group-head::after { height: 2px; background: rgba(0,0,0,.16); }
.contribution-group-count { font-family: var(--mono); }
.contribution-summary { --cut: 14px; border: none; }

.contribution-group.additional .contribution-summary::before { background: var(--tile); opacity: .35; }
.contribution-summary:hover { border-color: transparent; }
.contribution-summary-media::after { display: none; }
.contribution-summary-icon { background: var(--tile); color: var(--coin); }

.contribution-step dt { font-family: var(--mono); color: var(--cream-3); }
.contribution-step + .contribution-step { border-top: 2px solid rgba(0,0,0,.1); }
.code-link { border: none; background: var(--tile); color: var(--nav-ink); }
.code-link:hover, .code-link:focus-visible { background: var(--coin); color: #000; }

.flow-card-title { border-bottom: none; background: var(--tile); color: #fff; }
.flow-step-0, .flow-step-1, .flow-step-2, .flow-step-3 { --flow-bg: transparent; }

.flow-cell { border-right: 2px solid rgba(0,0,0,.1); }
.flow-label::before { width: 8px; height: 8px; background: var(--tile); }

.feedback-quote { border-left: 4px solid var(--tile); }

.detail-qa-item { border: none; border-left: 4px solid var(--coin); }
.iteration-card { border: none; }
.optimization-comparison img, .optimization-comparison .optimization-crop { border: none; background: var(--tile); }
/* 회고: 잘한 점 = 금, 아쉬운 점 = 지뢰 */

.retro-card.good, .retro-card.bad { border: none; background: var(--navy-2); }

.detail-nav-row { border-top: 2px solid rgba(0,0,0,.16); }

<script>

function buildAbout(){
  document.getElementById('about-role-tag').textContent=PROFILE.role;
  document.getElementById('about-name-ko').textContent=PROFILE.nameKo;
  document.getElementById('about-name-en').textContent=PROFILE.nameEn;
  document.getElementById('about-meta').innerHTML=`${PROFILE.university}<br><a href="mailto:${PROFILE.email}">${PROFILE.email}</a>`;
  buildAboutGlance();
  document.getElementById('footer-copy').textContent=`© ${new Date().getFullYear()} ${PROFILE.nameEn} — Game Client Programmer`;
  const w=document.getElementById('link-icons');
  PROFILE.links.forEach(l=>{
    const a=document.createElement('a'); a.className='link-icon'; a.href=l.url; a.target='_blank'; a.rel='noopener';
    a.innerHTML=`${IC[l.icon]||''} ${l.label}`; w.appendChild(a);
  });
}

// 히어로 오른쪽 '한눈에 보기' — 새 데이터 필드 없이 MILESTONE_SUMMARY, AWARDS, MAIN_PROJECT_IDS에서 만든다.
// 항목이 하나도 없으면 블록째 숨긴다.
// org · date 표기에서 줄바꿈은 org 안에서만 일어나게 한다. 기간은 '~' 앞에서만 꺾인다.
function joinDateRange(date){
  return (date||'').replace(/\s*~\s*/g, ' ~ ');
}

function buildAboutGlance(){
  const el=document.getElementById('about-glance');
  if(!el) return;
  const parts=[];

  const stats=(typeof MILESTONE_SUMMARY!=='undefined' ? MILESTONE_SUMMARY : []).filter(s=>s && s.value);
  if(stats.length){
    parts.push(`<div class="glance-stats">${stats.map(s=>`
      <div class="glance-stat"><span class="glance-stat-v">${escapeHTML(s.value)}</span><span class="glance-stat-k">${escapeHTML(s.label)}</span></div>`).join('')}
    </div>`);
  }

  const A=(typeof AWARDS!=='undefined' && AWARDS) || {};
  const honors=[
    ...(A['수상']||[]).map(x=>({...x, kind:'award', icon:'ti-trophy'})),
    ...(A['시험및자격증']||[]).map(x=>({...x, kind:'cert', icon:'ti-certificate'})),
  ];
  if(honors.length){
    parts.push(`<div><div class="glance-label">Awards &amp; Certificates</div><ul class="glance-list">${honors.map(h=>`
      <li class="glance-honor ${h.kind}">
        <span class="glance-honor-icon"><i class="ti ${h.icon}" aria-hidden="true"></i></span>
        <span><span class="glance-honor-t">${escapeHTML(h.title)}</span><span class="glance-honor-s">${escapeHTML([h.org, joinDateRange(h.date)].filter(Boolean).join(' · '))}</span></span>
      </li>`).join('')}</ul></div>`);
  }

  if(!parts.length){ el.hidden=true; return; }
  el.innerHTML=parts.join('');
  el.hidden=false;
}

// 기술 이름 → Tabler 아이콘. 브랜드 아이콘이 없는 항목은 성격이 비슷한 일반 아이콘을 쓴다.
// 새 아이콘을 추가하면 bash .claude/scripts/build-icons.sh로 서브셋을 다시 만든다.
const SKILL_ICONS = [
  [/unity/i, 'ti-brand-unity'], [/c#/i, 'ti-brand-c-sharp'], [/c\+\+/i, 'ti-brand-cpp'],
  [/postgres|sql/i, 'ti-database'], [/^git$/i, 'ti-brand-git'], [/github/i, 'ti-brand-github'],
  [/supabase/i, 'ti-brand-supabase'], [/jira/i, 'ti-layout-kanban'],
  [/claude/i, 'ti-terminal-2'], [/codex|openai|gpt/i, 'ti-brand-openai'], [/agent|loop/i, 'ti-infinity'],
  [/windows/i, 'ti-brand-windows'], [/android/i, 'ti-brand-android'],
];
function skillIcon(name){
  const hit = SKILL_ICONS.find(([re]) => re.test(name || ''));
  return hit ? hit[1] : 'ti-point';
}

function buildSkills(){
  const g=document.getElementById('skills-grid');

  // N++ 에피소드 타일: 머리 줄(에피소드 코드 + 카테고리), 레벨 칸(항목 수만큼 금), 항목 목록
  SKILLS.forEach((cat,idx)=>{
    // N++ 에피소드 번호: 열 문자(A~E) + 행 번호(00, 01 …)
    const code=`${String.fromCharCode(97+idx%5)}-${String(Math.floor(idx/5)).padStart(2,'0')}`;
    const div=document.createElement('div');
    div.className='cup';
    const itemsHTML=cat.items.map(it=>{
      const badge=it.icon
        ? `<img src="${it.icon}" alt="${escapeHTML(it.name)}" style="width:18px;height:18px;object-fit:contain;flex-shrink:0">`
        : `<i class="ti ${skillIcon(it.name)} cup-icon" aria-hidden="true"></i>`;
      return `<li class="cup-item">${badge}<span>${escapeHTML(it.name)}</span></li>`;
    }).join('');
    const cells=Array.from({length:Math.max(5, cat.items.length)},(_,i)=>`<i class="${i<cat.items.length?'on':''}"></i>`).join('');
    div.innerHTML=`
      <div class="cup-cat"><span class="cup-code">${code}</span><span class="cup-name">${escapeHTML(cat.category)}</span></div>
      <div class="cup-cells" aria-hidden="true">${cells}</div>
      <ul class="cup-items">${itemsHTML}</ul>`;
    g.appendChild(div);
  });
}

function buildAwards(){
  const grid = document.getElementById('awards-col-grid');
  if(!grid) return;

  function detectMilestoneKind(item){
    const t = `${item.title || ''} ${item.org || ''}`.toLowerCase();
    if(t.includes('unijam') || t.includes('잼')) return 'jam';
    if(t.includes('전시') || t.includes('playx4') || t.includes('unicon') || t.includes('창립제') || t.includes('박람회')) return 'exhibition';
    if(t.includes('메토링') || t.includes('nexon')) return 'program';
    return 'activity';
  }

  const activities = (AWARDS.대외활동 || []).map(item => ({ ...item, kind: detectMilestoneKind(item) }));
  const awards = (AWARDS.수상 || []).map(item => ({ ...item, kind: 'award' }));
  const certs = (AWARDS.시험및자격증 || []).map(item => ({ ...item, kind: 'cert' }));

  const KIND_ICON = { exhibition:'ti-device-gamepad-2', jam:'ti-bolt', program:'ti-users', activity:'ti-flag' };
  const byDateDesc = (a,b)=>String(b.date||'').localeCompare(String(a.date||''));
  const metaLine = item => [item.org, joinDateRange(item.date)].filter(Boolean).map(escapeHTML).join('\u00a0·\u00a0');
  const titleHTML = item => item.url
    ? `<a class="milestone-source" href="${escapeHTML(item.url)}" target="_blank" rel="noopener">${escapeHTML(item.title)}</a>`
    : escapeHTML(item.title);

  // 좌측: 대외활동만 연도별로 묶어 최신순 타임라인으로
  const years = [];
  activities.filter(i=>i && i.title).sort(byDateDesc).forEach(item => {
    const y = String(item.date||'').slice(0,4);
    if(!years.length || years[years.length-1].year !== y) years.push({ year:y, items:[] });
    years[years.length-1].items.push(item);
  });
  const timeline = years.map(g => `
    <div class="ag-year">${escapeHTML(g.year)}</div>
    <ol class="ag-list">${g.items.map(item => `
      <li class="ag-item">
        <span class="ag-badge" aria-hidden="true"><i class="ti ${KIND_ICON[item.kind] || KIND_ICON.activity}"></i></span>
        <div class="ag-title">${titleHTML(item)}</div>
        <div class="ag-meta">${metaLine(item)}</div>
      </li>`).join('')}
    </ol>`).join('');

  // 우측: 수상·자격증은 별도 목록 (히어로 패널과 같은 항목 스타일)
  const honorList = (list, kind, icon) => `<ul class="glance-list">${[...list].sort(byDateDesc).map(item => `
      <li class="glance-honor ${kind}">
        <span class="glance-honor-icon"><i class="ti ${icon}" aria-hidden="true"></i></span>
        <span><span class="glance-honor-t">${titleHTML(item)}</span><span class="glance-honor-s">${metaLine(item)}</span>
        ${item.validity ? `<span class="milestone-validity">${escapeHTML(item.validity)}</span>` : ''}</span>
      </li>`).join('')}</ul>`;
  const side = [
    awards.length ? `<div><div class="ag-label">Awards</div>${honorList(awards,'award','ti-trophy')}</div>` : '',
    certs.length ? `<div><div class="ag-label">Certifications</div>${honorList(certs,'cert','ti-certificate')}</div>` : '',
  ].join('');

  const summary = (typeof MILESTONE_SUMMARY!=='undefined' ? MILESTONE_SUMMARY : []).filter(s=>s && s.value);

  grid.className = '';
  grid.innerHTML = `
    ${summary.length ? `<div class="milestone-summary">${summary.map(item=>`<span>${escapeHTML(item.label)}</span><strong>${escapeHTML(item.value)}</strong>`).join('')}</div>` : ''}
    <div class="ag">
      ${timeline ? `<div class="ag-main">${timeline}</div>` : ''}
      ${side ? `<aside class="ag-side" aria-label="수상 및 자격증">${side}</aside>` : ''}
    </div>
  `;
}

function makeSlider(media,cont,dots,prev,next,preload='metadata'){
  let cur=0; const sl=[];
  media.forEach((m,i)=>{
    const s=document.createElement('div'); s.className='proj-slide'+(i===0?' active':'');
    s.innerHTML=m.src?(m.type==='video'?`
                <video controls muted playsinline preload="${preload}" poster="${m.thumbnail}">
                  <source src="${m.src}" type="video/mp4">
                </video>
              `:`<img src="${m.src}" alt="${m.label}" loading="lazy">`):`<div class="slide-placeholder">${m.type==='video'?IC.vid:IC.img}<span>${m.label}</span></div>`;
    if(m.label){const b=document.createElement('div');b.className='slide-type-badge';b.textContent=m.label;s.appendChild(b);}
    cont.appendChild(s); sl.push(s);
  });
  media.forEach((_,i)=>{
    const d=document.createElement('div'); d.className='slider-dot'+(i===0?' active':'');
    d.addEventListener('click',()=>go(i)); dots.appendChild(d);
  });
  function go(n){
    sl[cur].classList.remove('active');
    dots.children[cur].classList.remove('active');
    cur=(n+sl.length)%sl.length;
    sl[cur].classList.add('active');
    dots.children[cur].classList.add('active');
    syncProjectVideos();
  }
  if(prev)prev.addEventListener('click',e=>{e.stopPropagation();go(cur-1);});
  if(next)next.addEventListener('click',e=>{e.stopPropagation();go(cur+1);});
}

function pauseVideos(scope=document){
  scope.querySelectorAll('video').forEach(video=>{
    video.pause();
  });
}

function visibleRatio(el){
  if(!el) return 0;
  const rect=el.getBoundingClientRect();
  const visibleW=Math.max(0, Math.min(rect.right, window.innerWidth) - Math.max(rect.left, 0));
  const visibleH=Math.max(0, Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0));
  const area=Math.max(1, rect.width * rect.height);
  return (visibleW * visibleH) / area;
}

let activeProjectVideo=null;
function syncProjectVideos(){
  let next=null, bestScore=0;
  if(!document.hidden && !document.getElementById('detail-view').classList.contains('visible')){
    document.querySelectorAll('.project-card, .sub-project-card').forEach(card=>{
      const video=card.querySelector('.proj-slide.active video');
      if(!video) return;
      const ratio=visibleRatio(video);
      if(ratio < .5) return;
      const rect=video.getBoundingClientRect();
      const distance=Math.abs((rect.top+rect.bottom)/2-innerHeight/2)/innerHeight;
      // Keep the current video when two cards are equally visible to avoid playback churn.
      const score=ratio-distance*.2+(video===activeProjectVideo?.video ? .05 : 0);
      if(score>bestScore){bestScore=score;next=video;}
    });
  }
  if(next===activeProjectVideo?.video || (!next && !activeProjectVideo)) return;
  if(activeProjectVideo){activeProjectVideo.video.pause();activeProjectVideo=null;}
  if(!next) return;
  const selection={video:next};
  activeProjectVideo=selection;
  next.play().then(()=>{
    // An old play request may finish after scrolling to another card.
    if(activeProjectVideo!==selection && activeProjectVideo?.video!==next) next.pause();
  }).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) pauseVideos();
  syncProjectVideos();
});
// Manual playback also hands off the decoder rather than starting a second card.
document.addEventListener('play',event=>{
  const video=event.target;
  if(!(video instanceof HTMLVideoElement) || !video.closest('.project-card, .sub-project-card')) return;
  if(document.hidden || document.getElementById('detail-view').classList.contains('visible')){video.pause();return;}
  document.querySelectorAll('.project-card video, .sub-project-card video').forEach(other=>{
    if(other!==video && !other.paused) other.pause();
  });
  if(activeProjectVideo?.video!==video) activeProjectVideo={video};
},true);

function getProjectBadges(p, max=3){
  if(!Array.isArray(p.badges)) return '';
  return p.badges
    .slice(0,max)
    .map(b=>`<span class="proj-badge ${b.type || 'sub'}">${b.text}</span>`)
    .join('');
}

function getFirstSentence(text){
  if(!text) return '';
  const match=String(text).match(/^.*?[.!?。](?=\s|$)/);
  return match ? match[0] : text;
}

function createProjectCard(p, idx, variant='main'){
  const card=document.createElement('article');
  card.className=variant==='sub'
    ? 'sub-project-card'
    : 'project-card'+(idx%2===1?' reverse':'');
  const mw=document.createElement('div'); mw.className='proj-media';
  const sl=document.createElement('div'); sl.className='proj-slider';
  const dw=document.createElement('div'); dw.className='slider-dots';
  const pb=document.createElement('button'); pb.className='slider-btn'; pb.setAttribute('aria-label','이전'); pb.innerHTML=`<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>`;
  const nb=document.createElement('button'); nb.className='slider-btn'; nb.setAttribute('aria-label','다음'); nb.innerHTML=`<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>`;
  const nr=document.createElement('div'); nr.className='slider-nav'; nr.append(pb,dw,nb);
  mw.append(sl,nr); makeSlider(p.media,sl,dw,pb,nb,variant==='sub'?'none':'metadata');
  const info=document.createElement('div'); info.className='proj-info';
  const metaLine=(variant==='sub'
    ? [p.meta.engine, p.meta.team]
    : [p.meta.engine, p.meta.platform, p.meta.team]
  ).filter(Boolean).join(' · ');
  const th=(p.tags||[]).slice(0,3).map(t=>`<span class="proj-tag">${t}</span>`).join('');
  const badges=getProjectBadges(p, 3);
  const summary=variant==='sub' ? getFirstSentence(p.summary) : p.summary;
  const showMoreEnabled=canShowProjectDetail(p);
  const moreButton=showMoreEnabled?`<button class="proj-show-more" data-id="${p.id}">Show more ${IC.arr}</button>`:'';
  info.innerHTML=variant==='sub'?`
    <div class="sub-project-heading">
      <div class="proj-index">${p.meta.year||''}</div>
      ${badges?`<div class="proj-badges">${badges}</div>`:''}
    </div>
    <h3 class="proj-title">${p.title}</h3>
    <div class="proj-meta-line">${metaLine}</div>
    <div class="sub-project-footer"><p class="proj-summary">${summary}</p>${moreButton}</div>`:`
    <div class="proj-index">${p.meta.year||''}</div>
    ${badges?`<div class="proj-badges">${badges}</div>`:''}
    <h3 class="proj-title">${p.title}</h3>
    ${variant==='main'?`<div class="proj-subtitle">${p.subtitle||''}</div>`:''}
    ${variant==='main' && th?`<div class="proj-tags">${th}</div>`:''}
    <div class="proj-meta-line">${metaLine}</div>
    <p class="proj-summary">${summary}</p>
    ${moreButton}`;
  card.append(mw,info);
  return card;
}

function canShowProjectDetail(projectOrId){
  const p=typeof projectOrId==='string' ? PROJECTS[projectOrId] : projectOrId;
  return !!p && p.showMore !== false && p.detail?.showMore !== false;
}

function buildProjects(){
  const list=document.getElementById('projects-list');
  list.innerHTML='';
  const mainWrap=document.createElement('div');
  mainWrap.className='projects-main';
  MAIN_PROJECT_IDS.forEach((id,idx)=>{
    const p=PROJECTS[id]; if(!p)return;
    mainWrap.appendChild(createProjectCard(p, idx, 'main'));
  });
  list.appendChild(mainWrap);

  if(SUB_PROJECT_IDS.length){
    const sub=document.createElement('section');
    sub.className='projects-sub';
    sub.innerHTML=`
      <div class="projects-sub-head">
        <div class="projects-group-label">Sub Projects / Demo</div>
      </div>
      <div class="sub-project-grid" aria-label="보조 프로젝트"></div>`;

    SUB_PROJECT_IDS.forEach((id,idx)=>{

      track.appendChild(card);

    b.addEventListener('click',e=>{e.stopPropagation();showDetail(b.dataset.id);});
  });
}

let _currentDetailId = null;

function stripHTML(html){
  return String(html||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
}

function getStrongText(html){
  const match=String(html||'').match(/<strong>([\s\S]*?)<\/strong>/);
  return match ? stripHTML(match[1]) : stripHTML(html);
}

function getListItems(html, max=2){
  return [...String(html||'').matchAll(/<li>([\s\S]*?)<\/li>/g)]
    .slice(0,max)
    .map(m=>stripHTML(m[1]));
}

function resolveProjectLink(p, slot){
  const detail=p.detail || {};
  if(slot==='팀 문서'){
    const wanted=detail.linkMap?.[slot] || detail.linkMap?.Document || detail.linkMap?.Documentation || 'Google Drive';
    return (p.links||[]).find(l=>[wanted,'팀 문서','Document','Documentation'].includes(l.label)) || null;
  }
  const wanted=detail.linkMap?.[slot] || slot;
  return (p.links||[]).find(l=>l.label===wanted || l.label===slot) || null;
}

function escapeHTML(value){
  return String(value ?? '').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function renderCodeLink(item){
  if(!item.codeUrl) return '';
  try{
    const url=new URL(item.codeUrl);
    if(url.protocol!=='https:' || url.hostname!=='github.com') return '';
    const label=escapeHTML(`${item.title} · ${item.codeLabel || 'GitHub 샘플 코드'}`);
    return `<a class="code-link" href="${escapeHTML(url.href)}" target="_blank" rel="noopener" title="${label}" aria-label="${label}"><i class="ti ti-brand-github" aria-hidden="true"></i></a>`;
  }catch{return '';}
}

function renderFeedbackSource(source, url){
  if(!source) return '';
  const text=escapeHTML(source);
  // Source is optional; never infer an event or speaker from a feedback sentence.
  if(url && /^https?:\/\//.test(url)) return `<a class="feedback-citation" href="${escapeHTML(url)}" target="_blank" rel="noopener">${text}</a>`;
  return `<span class="feedback-citation">${text}</span>`;
}

function renderTechnicalDecisions(p) {
  if (!Array.isArray(p.technicalDecisions) || !p.technicalDecisions.length) return '';

  return `
    <div class="detail-section" id="detail-decisions">
      <div class="detail-section-label">Technical Decisions</div>
      <div class="detail-qa-list">
        ${p.technicalDecisions.map(item => `
          <div class="detail-qa-item">
            <div class="detail-qa-q">${item.q}</div>
            <div class="detail-qa-a">${item.a}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// 목표가 없으면 빈 문자열을 돌려주고, Overview의 Goal 블록을 숨긴다.
function getProjectGoal(p){
  if(typeof p.goal === 'string') return p.goal;
  if(Array.isArray(p.goal) && p.goal.length) return p.goal[0];
  return '';
}

function renderDetailOverview(p) {
  const detail=p.detail || {};
  const goal=getProjectGoal(p);
  const techStack = Array.isArray(detail.techStack) && detail.techStack.length
    ? detail.techStack
    : [p.meta.engine, ...(p.tags||[])].filter(Boolean);
  const infoHTML=Object.entries(p.meta).map(([k,v])=>`
    <div class="detail-info-item">
      <span class="detail-info-key">${k}</span>
      <span class="detail-info-val">${v}</span>
    </div>`).join('');
  const linksHTML=DETAIL_LINK_SLOTS.map(slot=>{
    const link=resolveProjectLink(p, slot);
    return link
      ? `<a class="detail-overview-link" href="${link.url}" target="_blank" rel="noopener"><span>${slot}</span>${IC.ext}</a>`
      : '';
  }).join('');
  const roleHTML = Array.isArray(p.role)
    ? `<div class="role-cards">${p.role.map((r,i)=>`
        <div class="role-card${i===0?' role-primary':''}">
          <div class="role-card-header">
            <i class="ti ${r.icon||'ti-code'} role-card-icon" aria-hidden="true"></i>
            <span class="role-card-name">${r.name}</span>
          </div>
          <div class="role-card-desc">${r.desc}</div>
        </div>`).join('')}</div>`
    : `<div class="detail-section-text">${p.role}</div>`;

  return `
    <section class="detail-section detail-overview-section" id="detail-overview">
      <div class="detail-section-label">Overview</div>

      <div class="detail-overview-layout">
        <div class="detail-overview-group">
          <div class="detail-overview-label">Tech Stack</div>
          <div class="detail-overview-chips">
            ${techStack.map(item => `<span>${item}</span>`).join('')}
          </div>
        </div>
        <div class="detail-overview-group">
          <div class="detail-overview-label">Project Info</div>
          <div class="detail-info-grid">${infoHTML}</div>
        </div>
        <div class="detail-overview-group">
          <div class="detail-overview-label">My Role</div>
          ${roleHTML}
        </div>
        ${goal ? `<div class="detail-overview-hero">
          <div class="detail-overview-kicker">Goal</div>
          <p class="detail-overview-goal">${escapeHTML(goal)}</p>
        </div>` : ''}
        <div class="detail-overview-group">
          <div class="detail-overview-label">Links</div>
          <div class="detail-overview-links">${linksHTML}</div>
        </div>
      </div>

  `;

function showDetail(id){
  const p=PROJECTS[id]; if(!p)return;
  if(!canShowProjectDetail(p)) return;
  const isMainDetail=MAIN_PROJECT_IDS.includes(id);
  const isSubDetail=SUB_PROJECT_IDS.includes(id);
  if(!isMainDetail && !isSubDetail) return;
  pauseVideos();
  activeProjectVideo=null;
  _currentDetailId = id;
  document.getElementById('d-eyebrow').textContent=p.meta.year+' · '+p.meta.engine;
  document.getElementById('d-title').textContent=p.title;
  document.getElementById('d-subtitle').textContent=p.subtitle;

  const dm=document.getElementById('d-media'); dm.innerHTML='';
  const dd=document.getElementById('d-dots'); dd.innerHTML='';
  let dc=0; const ds=[];
  p.media.forEach((m,i)=>{
    const s=document.createElement('div'); s.className='detail-media-slide'+(i===0?' active':'');
    s.innerHTML=m.src?(m.type==='video'?`
    <video controls autoplay muted playsinline preload="metadata"${m.thumbnail?` poster="${escapeHTML(m.thumbnail)}"`:''}>
      <source src="${m.src}" type="video/mp4">
    </video>
    `:`<img src="${m.src}" alt="${m.label}">`):`<div class="slide-placeholder">${m.type==='video'?IC.vid:IC.img}<span>${m.label}</span></div>`;
    dm.appendChild(s); ds.push(s);
    const d=document.createElement('div'); d.className='slider-dot'+(i===0?' active':'');
    d.addEventListener('click',()=>dgo(i)); dd.appendChild(d);
  });
  function dgo(n){ds[dc].classList.remove('active');dd.children[dc].classList.remove('active');dc=(n+ds.length)%ds.length;ds[dc].classList.add('active');dd.children[dc].classList.add('active');}
  document.getElementById('d-prev').onclick=()=>dgo(dc-1);
  document.getElementById('d-next').onclick=()=>dgo(dc+1);
  document.getElementById('d-sidebar').innerHTML='';

  // 본문 섹션들
  const main = document.getElementById('d-main');
  main.innerHTML = '';

  const sections = [];

  // 0. Project Overview
  sections.push(renderDetailOverview(p));

  // 2. Activities (있을 때만)
  if(p.activities && p.activities.length){
    const tagsHTML=p.activities.map(a=>`<span class="ow-tag">${a}</span>`).join('');
    sections.push(`<div class="detail-section" id="detail-activities">

function getClosest(els){
  const vh = window.innerHeight;
  const mid = vh / 2;
  let best = null, bestScore = -Infinity;
  els.forEach(el => {
    const rect = el.getBoundingClientRect();
    const visTop = Math.max(rect.top, 0);
    const visBot = Math.min(rect.bottom, vh);
    const visible = Math.max(0, visBot - visTop);
    if(visible <= 0) return;
    // 항목 자체 높이 대비 보이는 비율 (짧은 항목 보호)
    const ratio = visible / Math.min(rect.height, vh);
    // 중심이 화면 중앙에 가까울수록 보너스
    const elMid = rect.top + rect.height / 2;
    const centerBonus = 1 - Math.min(Math.abs(elMid - mid) / vh, 1);
    // 비율을 최우선, 절대 픽셀은 보조
    const score = ratio * 200 + centerBonus * 60 + visible * 0.1;
    if(score > bestScore){ bestScore = score; best = el; }
  });
  return best;
}

function sectionLightBottom(target){
  const nextHr = target.nextElementSibling;
  if(nextHr && (nextHr.classList.contains('rule') || nextHr.tagName === 'HR') && nextHr.getClientRects().length){
    return nextHr.getBoundingClientRect().bottom;
  }
  return target.getBoundingClientRect().bottom;
}

function setLight(target){
  if(!target){
    lightEl.classList.remove('visible');
    _prevSection = null;
    return;
  }
  const r = target.getBoundingClientRect();
  const bottom = sectionLightBottom(target);
  lightEl.style.top = r.top + 'px';
  lightEl.style.height = (bottom - r.top) + 'px';
  lightEl.classList.add('visible');
}

let ticking = false;
function onScroll(){
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(()=>{
    const isDetail = document.getElementById('detail-view').classList.contains('visible');

    if(isDetail){
      // 상세 페이지: 하이라이트 없음. 목차는 화면 위쪽 40% 선을 지난 마지막 섹션을 현재 섹션으로 표시
      lightEl.classList.remove('visible');
      const line = window.innerHeight * .4;
      const dLinks = Array.from(document.querySelectorAll('#d-toc a'));
      let current = dLinks[0];
      dLinks.forEach(a => { const el = document.getElementById(a.dataset.sec); if(el && el.getBoundingClientRect().top <= line) current = a; });
      dLinks.forEach(a => a.classList.toggle('active', a === current));
    } else {
      _prevDetail = null;

      // 섹션 하나만 (projects 제외 → light)
      const activeSection = getClosest(sections);
      sections.forEach(el => {
        const on = el === activeSection;
        if(on !== el.classList.contains('in-view')) el.classList.toggle('in-view', on);
      });
      tocLinks.forEach(a => a.classList.toggle('active', !!activeSection && a.dataset.sec === activeSection.id));

      if(activeSection !== _prevSection){
        _prevSection = activeSection;
        if(activeSection && activeSection.id !== 'projects'){
          lightEl.classList.remove('visible');
          // 위치 먼저 즉시 세팅, opacity만 fade
          const r = activeSection.getBoundingClientRect();
          const bottom = sectionLightBottom(activeSection);
          lightEl.style.top = r.top + 'px';
          lightEl.style.height = (bottom - r.top) + 'px';
          requestAnimationFrame(()=> requestAnimationFrame(()=> lightEl.classList.add('visible')));
        } else {
          lightEl.classList.remove('visible');
        }
      } else if(activeSection && activeSection.id !== 'projects'){
        setLight(activeSection);
      }

      // 프로젝트 카드 — 뷰포트에 조금이라도 보이는 카드 중 중심에 가장 가까운 것
      const cards = getCards();
      if(cards.length){
        // 뷰포트에 보이는 카드가 하나라도 있으면 활성화
        const visibleCards = cards.filter(el => {
          const r = el.getBoundingClientRect();
          return r.bottom > 0 && r.top < window.innerHeight;
        });
        if(visibleCards.length){
          const activeCard = getClosest(cards);
          cards.forEach(el => {
            const on = el === activeCard;
            if(on !== el.classList.contains('in-view')) el.classList.toggle('in-view', on);
          });
        } else {
          cards.forEach(el => {
            el.classList.remove('in-view');
          });
        }
      }
    }

    syncProjectVideos();
    ticking = false;
  });
}

window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);
onScroll();


/* ── N++ 타임바 + 닌자: 스크롤 진행률만큼 금 바가 차고, 닌자가 끝을 따라 달린다.
   스크롤 중에만 달리는 자세, 멈추면 서 있는 자세. 방향에 따라 좌우 반전. 장식이므로 실패해도 무시. ── */
(function(){
  const fill = document.getElementById('timebar-fill');
  const ninja = document.getElementById('ninja');
  const hud = document.getElementById('hud-time');
  if(!fill || !ninja) return;
  let lastY = window.scrollY, stopT = null, raf = null;
  function update(){
    raf = null;
    const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    const pct = Math.min(1, Math.max(0, window.scrollY / max));
    fill.style.transform = `scaleX(${pct})`;
    const track = ninja.parentElement.clientWidth - ninja.getBoundingClientRect().width - 16;
    ninja.style.transform = `translateX(${Math.round(pct * track)}px)`;
    if(hud) hud.textContent = (pct * 100).toFixed(3).padStart(7, '0');
    const y = window.scrollY;
    if(y !== lastY) ninja.classList.toggle('back', y < lastY);
    lastY = y;
  }
  function onMove(){
    ninja.classList.add('running');
    clearTimeout(stopT);
    stopT = setTimeout(() => ninja.classList.remove('running'), 160);
    if(!raf) raf = requestAnimationFrame(update);
  }
  window.addEventListener('scroll', onMove, { passive: true });
  window.addEventListener('resize', () => { if(!raf) raf = requestAnimationFrame(update); });
  update();
})();
</script>
