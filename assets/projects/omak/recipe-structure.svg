.title{font-size:22px;font-weight:700}
.lane{fill:#F8FAFC;stroke:#E2E8F0}.lt{font-size:16px;font-weight:700}
.card{fill:#fff;stroke:#94A3B8;stroke-width:1.5}.ct{font-size:15px;font-weight:700}.cs{font-size:14px;fill:#475569}
.team{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.5}
.hl{fill:#EEF2FF;stroke:#6366F1;stroke-width:1.5}
.sb{fill:#ECFDF5;stroke:#059669;stroke-width:1.5}
.mono{font-family:Consolas,'D2Coding',monospace;font-size:15px;font-weight:700;fill:#3730A3}
.band{fill:#FFF7ED;stroke:#EA580C;stroke-width:1.5}.bt{font-size:16px;font-weight:700;fill:#9A3412}.bs{font-size:15px;fill:#7C2D12}
.ok{font-size:14px;fill:#047857}.nul{font-size:14px;fill:#B91C1C}
.lbl{font-size:13px;fill:#9A3412}
.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#a)}
.inh{fill:none;stroke:#334155;stroke-width:1.5;marker-end:url(#h)}
.dash{fill:none;stroke:#EA580C;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#EA580C"/></marker>
<marker id="h" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L11 6L0 12z" fill="#fff" stroke="#334155" stroke-width="1.2"/></marker>
</defs>
<rect width="1100" height="430" fill="#fff"/>
<text class="title" x="30" y="38">레시피 데이터와 조합 조회 구조</text>

<rect class="lane" x="30" y="60" width="300" height="270" rx="12"/>
<text class="lt" x="50" y="88">데이터 에셋 · ScriptableObject</text>
<rect class="card" x="50" y="104" width="260" height="92" rx="8"/>
<text class="ct" x="66" y="131">RecipeBase · 조합 조건</text>
<text class="cs" x="66" y="156">CategoryData(기본 재료·조리법)</text>
<text class="cs" x="66" y="178">+ 육류/생선 · 채소</text>
